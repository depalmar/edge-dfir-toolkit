title: NetScaler WS-Federation Request With Bare wctx Parameter (CVE-2026-3055)
id: ee8d9ada-2e76-4297-9dba-186f9b2f02be
status: experimental
description: |
  watchTowr's reliable trigger for the CVE-2026-3055 memory over-read:
  GET /wsfed/passive?wctx, where the wctx parameter has no value and no "=".
  A vulnerable appliance returns leaked memory in the NSC_TASS cookie. Needs a
  proxy, WAF or sensor log in front of the gateway.
references:
  - https://labs.watchtowr.com/please-we-beg-just-one-weekend-free-of-appliances-citrix-netscaler-cve-2026-3055-memory-overread-part-2/
author: Raymond DePalma (edge-dfir-toolkit)
date: 2026-10-27
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2026-3055
logsource:
  category: webserver
detection:
  selection:
    Message|re: '/wsfed/passive\?([^\s"&]*&)*wctx(?=[\s"&]|$)'
  condition: selection
falsepositives:
  - Vulnerability scanners and researchers' check scripts.
level: medium
