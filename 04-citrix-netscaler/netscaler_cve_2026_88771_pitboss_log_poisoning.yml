title: NetScaler pitboss Log Line Carrying Injected Text (CVE-2026-88771)
id: 0f77da55-7344-4f48-81d9-ba11baa0629f
status: experimental
description: |
  Unit 42: in the CVE-2026-88771 chain, text injected into a failed login is
  written to ns.log as "pitboss PPE missed too many heartbeatsNSPPE;<additional text>"
  and later processed by the Perl script /netscaler/ns_monuploadd_err.pl. Rapid7
  shows the unexpectedly-died form ("pitboss PPE unexpectedly died NSPPE;...",
  with a space) carrying a fetch-and-run command and says the call-home crash
  handler executed it as root. The benign pitboss format is not published.
references:
  - https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/
  - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/
author: Raymond DePalma (edge-dfir-toolkit)
date: 2026-10-23
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
  - cve.2026-88771
logsource:
  product: citrix
  service: netscaler
detection:
  selection:
    Message|re: 'pitboss PPE (unexpectedly died|missed too many heartbeats)\s?NSPPE(-00)?;.+'
  condition: selection
falsepositives:
  - Unknown - the benign pitboss line format is not published.
level: critical
