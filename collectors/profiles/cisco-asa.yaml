# Collection profile - Cisco ASA (and FTD lina via the diagnostic CLI)
# Platform: EDGE-0005 (artifacts/catalog/cisco-asa.yml)
#
# Order matters more on this platform than any other in the MVP.
#   1. LINE DANCER (ArcaneDoor) lived only in memory and hooked the core-dump
#      routine so that a dump request rebooted the device instead. A reboot
#      erases it. The memory-region check therefore runs first, before anything
#      that could reload the box, and the core dump is break-glass and manual.
#   2. LINE RUNNER persisted through a zip on disk0: that is processed at boot.
#   3. LINE VIPER (2025) also turns a dump request into an immediate reboot, and
#      reboots the device when system:/text is copied (NCSC). CISA's implant check
#      on the text section therefore runs after every other live step.
#
# Cisco's published check: more than one executable (r-xp) memory region for
# lina, especially one exactly 0x1000 bytes long, indicates tampering.

profile: cisco-asa
platform_id: EDGE-0005
display: Cisco ASA / FTD (lina)
transports: [ssh, replay]

cli:
  prompt: '[\w.()/-]+[>#] ?$'
  pager: '<--- More --->'
  session_setup:
    - terminal pager 0
  # Allow rules must match the whole command (the engine uses fullmatch).
  allow:
    - 'show [\w -]+( \| (include|exclude|begin) [\w :./-]+)?'
    - 'dir( /recursive)? (disk0|disk1|flash):[\w/.-]*'
    # CISA ED 25-03's implant check, exactly as CISA prints it. Nothing else
    # starting with "more" is admitted.
    - 'more /binary system:/text \| grep 55534154 41554156 41575756 488bb3a0'
  deny:
    - '^(reload|write|copy|delete|erase|format|configure|crashinfo|debug|verify|clear|capture|test)( |$)'
    - '[;&`<>]|\$\('

expected_evidence: [identity, memory, process, sessions, config, system-logs, persistence]

steps:
  - id: show_clock
    tier: V0
    kind: command
    cmd: show clock
    purpose: Device clock.
    confidence: high

  - id: show_version
    tier: V0
    kind: command
    cmd: show version
    purpose: Version, hardware and uptime. A low uptime (unexpected reboot) after the exploitation window is itself a finding; ASA does not print a reload reason here, so pair it with show crashinfo.
    confidence: high

  - id: mem_region_lina
    tier: V1
    kind: command
    cmd: show memory region | include lina
    purpose: Executable memory regions mapped to lina. More than one r-xp region, especially one of exactly 0x1000 bytes, is the vendor's LINE DANCER indicator. Runs before anything that could reload the device.
    confidence: high
    references:
      - https://blog.talosintelligence.com/arcanedoor-new-espionage-focused-campaign-found-targeting-perimeter-network-devices/
      - https://www.ncsc.gov.uk/sites/default/files/documents/ncsc-tip-line-dancer.pdf

  - id: mem_region_full
    tier: V1
    kind: command
    cmd: show memory region
    timeout: 300
    purpose: Full region map, kept so the lina filter above can be re-checked by hand.
    confidence: high

  - id: show_checkheaps
    tier: V1
    kind: command
    cmd: show checkheaps
    purpose: >-
      Heap checker state, first snapshot. Checkheaps runs every 60 seconds by
      default; Cisco reports the 2025 ArcaneDoor actor disabled it. CISA's
      procedure waits at least five minutes before the second reading and calls
      a Total number of runs with no positive change "evidence of a potential
      compromise". Compared with show_checkheaps_late.
    confidence: high
    references:
      - https://sec.cloudapps.cisco.com/security/center/resources/detection_guide_for_continued_attacks
      - https://www.cisa.gov/news-events/directives/supplemental-direction-ed-25-03-core-dump-and-hunt-instructions

  - id: show_kernel_lina_cs
    tier: V2
    kind: command
    cmd: show kernel process | include lina_cs
    purpose: >-
      Cisco's check for the 2026 FXOS persistent implant (FIRESTARTER, per Talos) on Firepower 1000, 2100,
      4100, 9300 and Secure Firewall 1200, 3100, 4200: any output means the device
      is considered compromised. The legitimate lina_cs can get stuck; Cisco's
      false-positive check is verify disk0:/asdm.bin, then this command again. A
      cold restart removes the implant, so collect before anyone pulls power.
    confidence: high
    references:
      - https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-persist-CISAED25-03

  - id: show_processes
    tier: V2
    kind: command
    cmd: show processes
    purpose: Process table.
    confidence: high

  - id: show_conn_count
    tier: V2
    kind: command
    cmd: show conn count
    purpose: Connection table size.
    confidence: high

  - id: show_ssh_sessions
    tier: V3
    kind: command
    cmd: show ssh sessions
    purpose: Management SSH sessions now active.
    confidence: high

  - id: show_vpn_summary
    tier: V3
    kind: command
    cmd: show vpn-sessiondb summary
    purpose: VPN session counts.
    confidence: high

  - id: show_vpn_anyconnect
    tier: V3
    kind: command
    cmd: show vpn-sessiondb anyconnect
    purpose: Remote-access sessions with user, address and duration.
    confidence: high

  - id: lina_text_implant_grep
    tier: X
    kind: command
    impact: break-glass
    cmd: more /binary system:/text | grep 55534154 41554156 41575756 488bb3a0
    purpose: >-
      CISA ED 25-03's check for the 2025 actor's implant in the running lina text
      section; CISA - "Any output from this command is an indicator of
      compromise." Break-glass and last, beside the core dump: CISA says to stop
      all actions and contact it if the device crashes during its initial
      commands, and NCSC reports LINE VIPER reboots the device when system:/text
      is copied. Whether reading it with more can trigger that is not published,
      so it is opt-in (--break-glass) and runs after everything that a reload
      would destroy has been collected. Command as CISA prints it; its output
      format is not published.
    confidence: medium
    references:
      - https://www.cisa.gov/news-events/directives/supplemental-direction-ed-25-03-core-dump-and-hunt-instructions
      - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/RayInitiator-LINE-VIPER/ncsc-mar-rayinitiator-line-viper.pdf

  - id: show_running_config
    tier: P2
    kind: command
    cmd: show running-config
    timeout: 300
    purpose: Running configuration with secrets masked. ArcaneDoor disabled syslog and altered AAA, so logging and aaa sections are the first diff targets.
    confidence: high

  - id: show_logging
    tier: P5
    kind: command
    cmd: show logging
    purpose: Logging configuration and buffer. Logging that is off, or a buffer that ends abruptly, is a finding.
    confidence: high

  - id: show_crashinfo
    tier: P5
    kind: command
    cmd: show crashinfo
    purpose: Last crash record.
    confidence: medium

  - id: dir_disk0
    tier: P7
    kind: command
    cmd: "dir /recursive disk0:"
    purpose: >-
      disk0 contents. LINE RUNNER arrived as client_bundle.zip, which Talos says
      is deleted once processed at boot and re-created as
      client_bundle_install.zip at shutdown, so on a running device the zip is
      normally absent. Talos says LINE RUNNER's csco_config.lua creates a file
      named 1515480F4B538B669648B17C02337098 in csco_config/97/webcontent on
      disk0. Any zip here needs explaining.
    confidence: high
    references:
      - https://blog.talosintelligence.com/arcanedoor-new-espionage-focused-campaign-found-targeting-perimeter-network-devices/

  - id: show_checkheaps_late
    tier: P7
    kind: command
    cmd: show checkheaps | begin Checkheaps
    purpose: >-
      Second checkheaps snapshot, taken last so that time has passed since the
      first. The pipe only makes the command distinct for replay; the output is the
      same. The engine does not wait: CISA's procedure needs at least five minutes
      between the readings, and the check reports the actual gap. Repeat by hand if
      the gap was shorter and the counter has not moved.
    confidence: medium
    references:
      - https://sec.cloudapps.cisco.com/security/center/resources/detection_guide_for_continued_attacks
      - https://www.cisa.gov/news-events/directives/supplemental-direction-ed-25-03-core-dump-and-hunt-instructions

  - id: core_dump
    tier: X
    kind: manual
    impact: break-glass
    purpose: Core dump for memory analysis (RayDetect for the 2025 RayInitiator / LINE VIPER activity).
    instructions: |
      Do NOT start until every live step above (memory regions, checkheaps, processes,
      sessions, lina_text_implant_grep) has been collected and saved off the device.
      CISA's Supplemental Direction procedure reloads the device twice: "The steps
      below trigger an immediate reload of the device", starting with "Soft reboot the
      device to maximize the likelihood of a clean core dump", then crashinfo force
      page-fault. Either reload destroys memory-only implants.
      LINE DANCER hooked the dump routine so that a dump request reloaded the device.
      NCSC reports LINE VIPER does the same ("instead the device immediately reboots"),
      reboots the device when system:/text is copied, and makes verify of system:/text
      return the hash of the legitimate firmware - so a matching text hash proves nothing.
      A dump attempt that reboots without producing a file is itself a finding (NCSC:
      it "could indicate that LINE VIPER was deployed"). CISA: if nothing is written,
      record it, retry once, and if there is still no output "document and inform CISA".
      Follow CISA's procedure for your exact model and release, scan the dump with
      RayDetect (ASA 5500-X only; it cannot detect RayInitiator in Firepower dumps), and
      ingest the dump and the scanner output:
        edge-triage ingest <case> --label coredump --bundle <file>
    references:
      - https://www.cisa.gov/news-events/directives/supplemental-direction-ed-25-03-core-dump-and-hunt-instructions
      - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/RayInitiator-LINE-VIPER/ncsc-mar-rayinitiator-line-viper.pdf
      - https://github.com/cisagov/RayDetect
