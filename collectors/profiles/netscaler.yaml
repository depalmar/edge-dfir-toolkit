# Collection profile - Citrix NetScaler ADC / Gateway
# Platform: EDGE-0004 (artifacts/catalog/netscaler.yml)
#
# NetScaler is the one MVP platform with a real shell: the nsroot CLI runs
# FreeBSD commands through `shell <cmd>`. That makes UAC-style live response
# possible, and also means the shell's own binaries are what we trust. A
# userland rootkit can lie to `ps`, `ls` and `stat`; disk-image triage (the
# break-glass step) is the check that does not depend on them.
#
# The root filesystem is a memory disk rebuilt at boot. Implants written there
# die on reboot; /var and /flash persist. Collect before anyone reboots.

profile: netscaler
platform_id: EDGE-0004
display: Citrix NetScaler ADC / Gateway
transports: [ssh, replay]

cli:
  prompt: '>'
  pager: '--More--'
  session_setup: []
  # Allow rules must match the whole command (the engine uses fullmatch). The
  # shell rules are a grammar, not a prefix: `shell` hands the line to sh, which
  # strips quotes and backslashes, so any free-form text would let -delete or
  # -exec through in disguise. Quotes appear only around a -name glob.
  allow:
    - 'show (ns version|ns runningConfig|system session|aaa session)'
    - 'shell (date -u|uptime|ps auxww|netstat -an|sockstat -46|crontab -l|cat /etc/crontab|cat /etc/httpd.conf|cat /flash/nsconfig/rc.netscaler)'
    - 'shell ls -la( /[\w./-]+)+'
    - "shell find( /[\\w./-]+)+( -xdev| -maxdepth \\d+| -type [fd]| -perm [-+]?[0-7]{3,4}| -name '[\\w*.?-]+')*( -ls)?"
  deny:
    - '^(set|unset|add|rm|enable|disable|save|reboot|shutdown|clear|apply|sync|batch|kill)( |$)'
    - '[;&|`<>]|\$\('
    - '-(delete|exec(dir)?|ok(dir)?|fprint|fls)\b'

expected_evidence: [identity, process, sessions, config, auth-logs, web-logs, filesystem, persistence]

# Runs of this profile against a real device or a vendor virtual edition, each
# {release, date, basis}. Empty: the CLI warns and live collection needs
# --accept-unvalidated. Add an entry only with the run recorded in
# docs/VERIFICATION.md (Device verification).
validated_on: []

steps:
  - id: shell_date
    tier: V0
    kind: command
    cmd: shell date -u
    purpose: Device clock in UTC.
    confidence: high

  - id: show_version
    tier: V0
    kind: command
    cmd: show ns version
    purpose: Build. Selects which CVE packs apply and which baseline to compare against.
    confidence: high

  - id: shell_uptime
    tier: V0
    kind: command
    cmd: shell uptime
    purpose: A reboot since compromise means anything written to the memory-disk root is gone.
    confidence: high

  - id: shell_ps
    tier: V2
    kind: command
    cmd: shell ps auxww
    purpose: Process list. Reverse shells, tunnels and miners.
    confidence: high

  - id: shell_netstat
    tier: V2
    kind: command
    cmd: shell netstat -an
    purpose: Sockets. Listeners that are not NetScaler services, and egress from the management plane.
    confidence: high

  - id: shell_sockstat
    tier: V2
    kind: command
    cmd: shell sockstat -46
    purpose: Socket-to-process mapping, so a listener can be attributed to a binary.
    confidence: high

  - id: show_system_session
    tier: V3
    kind: command
    cmd: show system session
    purpose: Management sessions now active.
    confidence: medium

  - id: show_aaa_session
    tier: V3
    kind: command
    cmd: show aaa session
    purpose: Gateway AAA sessions. Replayed session tokens (Citrix Bleed class) are sessions from addresses the user never had.
    confidence: medium

  - id: show_running_config
    tier: P2
    kind: command
    cmd: show ns runningConfig
    timeout: 600
    purpose: Running configuration. New system users, policies and responder actions.
    confidence: high

  - id: php_stat
    tier: P6
    kind: command
    cmd: shell find /var/netscaler/logon /var/vpn /netscaler/ns_gui /var/netscaler/ns_gui -type f -name '*.php' -ls
    purpose: >-
      Every PHP file under the web roots with mode, owner, size and mtime
      (find -ls). Web shells from the 2023 mass exploitation campaign sat in these
      directories. Fox-IT's triage tool expects shipped PHP at mode 0444, so a
      writable PHP file here is a lead.
    confidence: medium
    references:
      - https://github.com/fox-it/citrix-netscaler-triage

  - id: suid_files
    tier: P7
    kind: command
    cmd: shell find /var /tmp /flash -xdev -type f -perm -4000
    purpose: SUID binaries outside the shipped set, a persistence and privilege technique seen on backdoored NetScalers.
    confidence: medium

  - id: crontab_root
    tier: P7
    kind: command
    cmd: shell crontab -l
    purpose: Root crontab.
    confidence: high

  - id: crontab_system
    tier: P7
    kind: command
    cmd: shell cat /etc/crontab
    purpose: System crontab.
    confidence: high

  - id: listing_tmp
    tier: P6
    kind: command
    cmd: shell ls -la /tmp /var/tmp
    purpose: Staging directories.
    confidence: high

  - id: core_list
    tier: P6
    kind: command
    cmd: shell find /var/core -name 'NSPPE-*' -ls
    purpose: >-
      Packet-engine core files, listed not copied (Bishop Fox: "roughly 2.3 GB
      on our 14.1 appliance"). Bishop Fox, for CVE-2026-8452: "A fresh NSPPE-*
      core file" is "The same crash, with the evidence attached", and "Core files
      land in the directory for the current boot, so looking only in
      /var/core/1 misses anything that arrived after a reboot; use find
      /var/core -name 'NSPPE-*' instead." NCSC-NL's core-dump rules
      (github.com/NCSC-NL/citrix-2025, core-dump-checks) scan these files once
      they are copied off the device: ingest them with --evidence-class memory
      and pass the rules to analyze with --memory-yara.
    confidence: low
    unverified: true
    references:
      - https://bishopfox.com/blog/no-crash-required-verifying-the-citrix-netscaler-saml-patch-for-cve-2026-8452

  - id: fetch_php
    tier: P6
    kind: fetch
    list_cmd: shell find /var/netscaler/logon /var/vpn /netscaler/ns_gui /var/netscaler/ns_gui -type f -name '*.php'
    purpose: Copy every PHP file under the web roots for YARA and content review.
    confidence: medium

  - id: httpd_conf
    tier: P2
    kind: command
    cmd: shell cat /etc/httpd.conf
    purpose: >-
      Apache configuration. The appliance ships with php_flag engine off; the 2026
      log-poisoning intrusions switched it on and added CSS-looking aliases to web
      shells, and NCSC-NL's CVE-2025-6543 check looks for Require all denied and
      php_flag engine off commented out.
    confidence: medium
    references:
      - https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/
      - https://raw.githubusercontent.com/NCSC-NL/citrix-2025/main/live-host-bash-check/TLPCLEAR_check_script_cve-2025-6543-v1.8.sh

  - id: rc_netscaler
    tier: P2
    kind: command
    cmd: shell cat /flash/nsconfig/rc.netscaler
    purpose: Start-up script on persistent flash. NCSC-NL checks it for python; Rapid7 saw the 2026 framework persist through it.
    confidence: medium
    references:
      - https://raw.githubusercontent.com/NCSC-NL/citrix-2025/main/live-host-bash-check/TLPCLEAR_check_script_cve-2025-6543-v1.8.sh
      - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/

  - id: logonpoint_custom
    tier: P6
    kind: command
    cmd: shell ls -la /var/netscaler/logon/LogonPoint/custom
    purpose: >-
      The Gateway UI customisation directory, web-reachable by design. The 2026
      intrusions hid PHP web shells here as .ctxs.receiver and .slap.receiver,
      which the *.php search misses.
    confidence: medium
    references:
      - https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/
      - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/

  - id: nsconfig_listing
    tier: P7
    kind: command
    cmd: shell ls -la /flash/nsconfig
    purpose: Persistent configuration directory (/nsconfig points here). Rapid7 found the 2026 framework under /nsconfig/.slap and a relay implant under /nsconfig/.relay.
    confidence: medium
    references:
      - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/

  - id: listing_flash
    tier: P7
    kind: command
    cmd: shell ls -la /flash
    purpose: >-
      Persistent flash. Rapid7 found the 2026 nsvmd proxy agent and its
      watchdog under /flash/.nsvm, marked immutable with chflags uchg.
    confidence: medium
    references:
      - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/

  - id: bin_sh_mode
    tier: P7
    kind: command
    cmd: shell ls -la /bin/sh
    purpose: Mode of /bin/sh. Both Unit 42 and Rapid7 report the actor ran chmod 6555 /bin/sh so the unprivileged web process could become root; the suid search above does not cover /bin.
    confidence: medium
    references:
      - https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/
      - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/

  - id: fetch_logs
    tier: P3
    kind: fetch
    list_cmd: shell find /var/log -maxdepth 1 -type f -name 'ns.log*'
    purpose: ns.log and its rotations. AAA failures with non-printable bytes are the CVE-2025-5777 memory-leak signature, and rotation is fast on a busy gateway.
    confidence: medium

  - id: fetch_httpaccess
    tier: P4
    kind: fetch
    list_cmd: shell find /var/log -maxdepth 1 -type f -name 'http*.log*'
    purpose: Web access and error logs for the management and gateway virtual servers.
    confidence: medium

  - id: disk_image
    tier: X
    kind: manual
    impact: break-glass
    purpose: Offline image of the persistent disks, the check that does not trust the device's own binaries.
    instructions: |
      Image the memory-disk root (md0) and the persistent disk - named da0, ad0,
      ada0 or similar depending on model, BIOS and hypervisor - to an external
      target, or snapshot the VPX at the hypervisor with memory. Analyse
      the images offline (Dissect-based triage such as fox-it/citrix-netscaler-triage
      or NCSC-NL citrix-2025 disk-image checks). Then ingest the triage output:
        edge-triage ingest <case> --label image-triage --bundle <output>
    references:
      - https://github.com/fox-it/citrix-netscaler-triage
      - https://github.com/NCSC-NL/citrix-2025
