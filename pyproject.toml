[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgetriage"
version = "0.12.0"
description = "Forensic triage for compromised edge devices: VPN concentrators, firewalls and gateways."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Raymond DePalma"}]
maintainers = [{name = "DePalma Research LLC"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.18", "paramiko>=3.4"]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
test = ["pytest>=8.0", "yara-python>=4.3"]

[project.scripts]
edge-triage = "edgetriage.cli:main"

[tool.setuptools]
packages = ["edgetriage", "edgetriage.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
