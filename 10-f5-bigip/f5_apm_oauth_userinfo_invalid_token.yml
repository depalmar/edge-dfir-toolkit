title: F5 BIG-IP APM OAuth UserInfo Invalid-Token Failures (CVE-2026-94127)
id: f5c9de77-0ba1-4cb4-af9f-02607a255e7b
status: experimental
description: |
  F5's CVE-2026-94127 log indicator: "Request UserInfo ... failed. Error Code
  (invalid_token)" with message id 01990004 in /var/log/apm. F5's rule is 10 or
  more in one log, especially if all come from a single address, and F5 rates it
  a medium-confidence indicator. This rule finds the events; the count belongs
  in the SIEM (or the f5_apm_oauth_userinfo_burst check in this toolkit). Only
  APM configured as an OAuth Authorization Server is exposed.
references:
  - https://my.f5.com/manage/s/article/K000162605
author: Raymond DePalma (edge-dfir-toolkit)
date: 2026-10-22
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2026-94127
logsource:
  product: f5
  service: apm
detection:
  keywords_id:
    - '01990004'
  keywords_msg:
    - 'Request UserInfo'
  keywords_err:
    - 'invalid_token'
  condition: keywords_id and keywords_msg and keywords_err
falsepositives:
  - Clients presenting expired tokens. Volume from one source is what matters.
level: medium
