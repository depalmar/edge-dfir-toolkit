title: F5 BIG-IP Audit Log Records a Shell Command Run Through tmsh (run util bash -c)
id: 8bb64e67-6279-42b0-8fd2-79ec220ec117
status: experimental
description: |
  The tmsh audit log records `run util bash -c` with the command that was run, as
  in F5's CVE-2022-1388 example (K23605346, "cmd_data=run util bash -c id").
  Legitimate automation uses it too; the user and the command decide. The
  c05d5254 audit lines F5 publishes have no -c and are covered by
  f5_tmsh_run_util_bash_hubble.yml.
references:
- https://my.f5.com/manage/s/article/K23605346
author: Raymond DePalma (edge-dfir-toolkit)
date: '2026-10-23'
tags:
- attack.execution
- attack.t1059.004
- cve.2022-1388
logsource:
  product: f5
  service: audit
detection:
  keywords:
  - cmd_data=run util bash -c
  condition: keywords
falsepositives:
- Administrators and automation that drive bash through tmsh.
level: medium
