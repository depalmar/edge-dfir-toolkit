title: F5 BIG-IP Audit Log Records a Shell Command Run Through tmsh (run util bash -c)
id: 8bb64e67-6279-42b0-8fd2-79ec220ec117
status: experimental
description: 'The tmsh audit log records `run util bash -c` with the command that was run. The follow-on
  of

  CVE-2022-1388 and CVE-2023-46747 exploitation, and the c05d5254 activity when run by the

  f5hubblelcdadmin account. Legitimate automation uses it too; the user and the command decide.

  '
