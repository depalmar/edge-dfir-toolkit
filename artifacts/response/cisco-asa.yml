    url: https://www.cisa.gov/news-events/alerts/2025/11/12/update-implementation-guidance-emergency-directive-cisco-asa-and-firepower-device-vulnerabilities
    accessed: "2026-10-22"
  - title: Cisco - Continued evolution of persistence mechanism (cisco-sa-asaftd-persist-CISAED25-03)
    url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-persist-CISAED25-03
    accessed: "2026-10-23"
  - title: Cisco - Detection guide for continued attacks against Cisco firewalls
    url: https://sec.cloudapps.cisco.com/security/center/resources/detection_guide_for_continued_attacks
    accessed: "2026-10-23"

