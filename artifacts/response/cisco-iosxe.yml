    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a
    accessed: "2026-10-22"
  - title: Cisco Talos - Salt Typhoon analysis
    url: https://blog.talosintelligence.com/salt-typhoon-analysis/
