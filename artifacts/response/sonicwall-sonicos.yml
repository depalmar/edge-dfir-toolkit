notes: >-
  The containment and credential steps are SonicWall's Essential Credential
  Reset, written for the MySonicWall backup incident and the SSL VPN activity;
  its table lists many more services (SNMPv3, DDNS, wireless keys, SSO secrets,
  DPI-SSL's re-signing CA) to rotate after the critical ones. SonicWall does not
  publish a re-image procedure for a compromised firewall; the toolkit adds none.
