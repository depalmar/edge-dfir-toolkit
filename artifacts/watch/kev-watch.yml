# Advisory watch - read by artifacts/scripts/advisory_watch.py and gated by validate.py.
# Schema: ../schema/watch.schema.json
#
# Every KEV entry on a watched platform added on or after `since` is either
# covered by a pack (its CVE is in the pack's `cves`) or has a decision below.
# The weekly workflow reports anything else as new. Nothing is added to the
# repository automatically: a person reads the primary sources and records the
# outcome here or as a pack / indicator set.

kev_url: https://raw.githubusercontent.com/cisagov/kev-data/main/known_exploited_vulnerabilities.json

# Entries added to KEV before this date are not reported. They were never
# triaged one by one; coverage of older CVEs is whatever the packs already have.
since: '2024-01-01'

# Regexes are searched in KEV's own vendorProject and product strings.
platforms:
  EDGE-0001: {vendor: '^Palo Alto Networks$', product: '^PAN-OS'}
  EDGE-0002: {vendor: '^Fortinet$', product: 'FortiOS|FortiProxy|Multiple Products'}
  EDGE-0003: {vendor: '^(Ivanti|Pulse Secure)$', product: 'Connect Secure|Policy Secure'}
  EDGE-0004: {vendor: '^Citrix$', product: 'NetScaler|Application Delivery Controller', exclude: '^NetScaler SD-WAN Enterprise'}
  EDGE-0005: {vendor: '^Cisco$', product: 'Adaptive Security Appliance|\(ASA\)|Firepower Threat Defense'}
  EDGE-0006: {vendor: '^SonicWall$', product: 'SMA ?100(?!0)'}
  EDGE-0007: {vendor: '^Check Point$', product: 'Gateway|Multiple Products'}
  EDGE-0008: {vendor: '^Juniper$', product: 'Junos'}
  EDGE-0009: {vendor: '^Cisco$', product: 'IOS XE|IOS and IOS XE|IOS, (IOS )?XR, and (IOS )?XE|IOS Software and Cisco IOS XE'}
  EDGE-0010: {vendor: '^F5$', product: 'BIG-IP'}

