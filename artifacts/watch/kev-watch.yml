# Advisory watch - read by artifacts/scripts/advisory_watch.py and gated by validate.py.
# Schema: ../schema/watch.schema.json
#
# Every KEV entry on a watched platform added on or after `since` is either
# covered by a pack (its CVE is in the pack's `cves`) or has a decision below.
# The weekly workflow reports anything else as new. Nothing is added to the
# repository automatically: a person reads the primary sources and records the
# outcome here or as a pack / indicator set.

kev_url: https://raw.githubusercontent.com/cisagov/kev-data/main/known_exploited_vulnerabilities.json

# Entries added to KEV before this date are not reported. They were never
# triaged one by one; coverage of older CVEs is whatever the packs already have.
since: '2024-01-01'

# Regexes are searched in KEV's own vendorProject and product strings.
platforms:
  EDGE-0001: {vendor: '^Palo Alto Networks$', product: '^PAN-OS'}
  EDGE-0002: {vendor: '^Fortinet$', product: 'FortiOS|FortiProxy|Multiple Products'}
  EDGE-0003: {vendor: '^(Ivanti|Pulse Secure)$', product: 'Connect Secure|Policy Secure'}
  EDGE-0004: {vendor: '^Citrix$', product: 'NetScaler|Application Delivery Controller', exclude: '^NetScaler SD-WAN Enterprise'}
  EDGE-0005: {vendor: '^Cisco$', product: 'Adaptive Security Appliance|\(ASA\)|Firepower Threat Defense'}
  EDGE-0006: {vendor: '^SonicWall$', product: 'SMA ?100(?!0)'}
  EDGE-0007: {vendor: '^Check Point$', product: 'Gateway|Multiple Products'}
  EDGE-0008: {vendor: '^Juniper$', product: 'Junos'}
  EDGE-0009: {vendor: '^Cisco$', product: 'IOS XE|IOS and IOS XE|IOS, (IOS )?XR, and (IOS )?XE|IOS Software and Cisco IOS XE'}
  EDGE-0010: {vendor: '^F5$', product: 'BIG-IP'}
  EDGE-0011: {vendor: '^SonicWall$', product: 'SMA ?1000'}

# sha256 of each publisher file as it was parsed (checked 2026-10-27 against the
# copies the indicator sets were built from). A change means re-parse and re-validate.
upstream:
  EDGE-IOC-0001: d73094b451db924c7faed7095c1096a3c4522408c8807e1553b7e0d6c4cc2754
  EDGE-IOC-0002: df674c52047f03739a1e455edf6e24d852e399d3ad9de6df4680163204a4dccb
  EDGE-IOC-0003: d730f25b110e4fb7019eefd1458f84ee96523f81b4a0b8d849e8c801df2dca81
  EDGE-IOC-0004: 1205e54135dbdf9556287f66d46a0dd0ddc67ef4fec36695dc4fd941a47b65da
  EDGE-IOC-0005: dbd18784d78708a3a17db67f0414c521c59bb55e1c91def63804ecd4cf755666
  EDGE-IOC-0006: 6d3b2a1f21483ab914fa6f166d738004aded96a8769186068c2c23c61f87b40d
  EDGE-IOC-0009: efb7f9c65888fc9fb4724d8404dbd1df39e1964d3f0efb63019701ce95665307
  EDGE-IOC-0013: 1d0619d9908ee7b0a4dcf13ff24762643d4ab2844559fbd2eb562c03435f5e40

triaged:
  - cve: CVE-2026-0322
    platform: EDGE-0001
    decision: iocs
    refs:
    - EDGE-IOC-0012
    date: '2026-10-27'
    basis: Palo Alto Networks' advisory publishes three addresses tied to exploit attempts and no host-side indicator,
      so there is no on-box detection to add; the management-interface hardening control now cites it.
  - cve: CVE-2026-19490
    platform: EDGE-0004
    decision: lab-only
    date: '2026-10-27'
    basis: 'Citrix CTX696939 publishes no indicators or exploitation statement. Bishop Fox''s lab work: a Gateway
      bypass "logs an SSL VPN login for user anonymous" and "Every session this bug mints is anonymous", but the ns.log
      text is not published; revisit with a real sanitized line.'
  - cve: CVE-2026-20349
    platform: EDGE-0005
    decision: no-indicators
    date: '2026-10-27'
    basis: 'Cisco cisco-sa-asaftd-vpn-dos-dzv4mQFF: exploited ("In August 2026, the Cisco PSIRT became aware of active
      exploitation") via "a crafted HTTP request" causing a reload; no request, crash text or syslog ID is published,
      only Snort rules.'
  - cve: CVE-2019-6693
    platform: EDGE-0002
    decision: no-indicators
    date: '2026-10-27'
    basis: 'FG-IR-19-007: offline decryption of ENC values "If the CLI configuration is exposed"; nothing happens
      on the device. Hardening candidate: set private-data-encryption enable.'
  - cve: CVE-2025-32756
    platform: EDGE-0002
    decision: out-of-scope
    date: '2026-10-27'
    basis: FG-IR-25-254 affects "FortiVoice, FortiMail, FortiNDR, FortiRecorder and FortiCamera" only; "Fortinet has
      observed this to be exploited in the wild on FortiVoice." FortiOS is not affected.
  - cve: CVE-2024-3393
    platform: EDGE-0001
    decision: no-indicators
    date: '2026-10-27'
    basis: 'Palo Alto Networks gives only a symptom: the firewall "stops responding or reboots unexpectedly"; no log
      message, crash file or Threat ID.'
  - cve: CVE-2014-2120
    platform: EDGE-0005
    decision: no-indicators
    date: '2026-10-27'
    basis: 'Cisco: "insufficient input validation of a parameter" and "additional attempted exploitation" in November
      2024; no parameter, request or log line is published.'
  - cve: CVE-2024-23113
    platform: EDGE-0002
    decision: no-indicators
    date: '2026-10-27'
    basis: 'FG-IR-24-029: "A third-party report is indicating this may be exploited in the wild"; no source named
      and no indicators.'
  - cve: CVE-2020-3259
    platform: EDGE-0005
    decision: no-indicators
    refs:
    - EDGE-HUNT-0026
    date: '2026-10-27'
    basis: 'Cisco: "sending a crafted GET request to the web services interface"; Truesec "made an early decision
      to refrain from publicly releasing the exploit". Truesec''s RADIUS pattern is a hunt candidate, not a pack detection.'
  - cve: CVE-2023-6549
    platform: EDGE-0004
    decision: no-indicators
    date: '2026-10-27'
    basis: 'Citrix CTX584986: "Exploits of these CVEs on unmitigated appliances have been observed"; NetScaler blog
      withholds detail and no researcher publication gives indicators.'
  - cve: CVE-2023-6548
    platform: EDGE-0004
    decision: no-indicators
    date: '2026-10-27'
    basis: Same bulletin CTX584986; no indicators from Citrix or a researcher. NHS England relays a CrowdStrike claim
      of no authentication needed; CrowdStrike's own publication was not found.
  - cve: CVE-2025-40602
    platform: EDGE-0011
    decision: no-indicators
    date: '2026-10-29'
    basis: 'SonicWall SNWLID-2025-0019: "reported to be leveraged in combination with CVE-2025-23006 (CVSS score 9.8)
      to achieve unauthenticated remote code execution with root privileges", credited to Google Threat Intelligence
      Group; no IoCs are published, and no GTIG publication on it was found. CVE-2025-23006''s message-log check is
      EDGE-PACK-0037.'
  - cve: CVE-2026-83548
    platform: EDGE-0011
    decision: no-indicators
    date: '2026-10-29'
    basis: 'SonicWall SNWLID-2026-0016: "SonicWall PSIRT has investigated a case indicating the active exploitation";
      it publishes no IoCs and tells customers to "Contact SonicWall Technical Support for assistance reviewing the
      system for indicators of compromise (IoCs)". A web search turned up news and vendor-blog coverage only, none
      of it from a party that observed the exploitation.'
  - cve: CVE-2026-83549
    platform: EDGE-0011
    decision: no-indicators
    date: '2026-10-29'
    basis: Same advisory SNWLID-2026-0016 (a post-authentication OS command injection in the AMC); no IoCs from SonicWall
      or a researcher.
