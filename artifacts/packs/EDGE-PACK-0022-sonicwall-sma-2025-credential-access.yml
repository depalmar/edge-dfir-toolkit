# Detection pack EDGE-PACK-0022

id: EDGE-PACK-0022
name: SonicWall SMA 100 exploited flaws, 2025 (CVE-2021-20035, CVE-2023-44221, CVE-2024-38475)
platforms: [EDGE-0006]
cves: [CVE-2021-20035, CVE-2023-44221, CVE-2024-38475]
summary: >-
  SonicWall marked two authenticated command injections "potentially being
  exploited in the wild" in April 2025, and CISA added the Apache path flaw
  CVE-2024-38475 the same week. Arctic Wolf reported a credential access
  campaign from January 2025 using the local super-admin admin@LocalDomain
  account, whose default password is password. GTIG found no evidence UNC6148
  used watchTowr's CVE-2024-38475 + CVE-2023-44221 chain. The one log signature public is a researcher's
  reproduction of the CVE-2024-38475 file read; account misuse is a hunt in
  the forwarded logs, not an on-box check.
confidence: low
unverified: true
references:
  - title: SonicWall PSIRT - SNWLID-2021-0022 (CVE-2021-20035)
    url: https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2021-0022
    accessed: "2026-10-23"
  - title: SonicWall PSIRT - SNWLID-2023-0018 (CVE-2023-44221)
    url: https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2023-0018
    accessed: "2026-10-23"
  - title: SonicWall PSIRT - SNWLID-2024-0018 (CVE-2024-38475 on SMA 100, fixed in 10.2.1.14-75sv)
    url: https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2024-0018
    accessed: "2026-10-23"
  - title: Arctic Wolf - Credential access campaign targeting SonicWall SMA devices potentially linked to exploitation of CVE-2021-20035
    url: https://arcticwolf.com/resources/blog/credential-access-campaign-targeting-sonicwall-sma-devices-potentially-linked-to-exploitation-of-cve-2021-20035/
    accessed: "2026-10-23"
  - title: watchTowr - SonicBoom, from stolen tokens to remote shells (CVE-2023-44221, CVE-2024-38475)
    url: https://labs.watchtowr.com/sonicboom-from-stolen-tokens-to-remote-shells-sonicwall-sma100-cve-2023-44221-cve-2024-38475/
    accessed: "2026-10-23"

detect:
  - id: sma-38475-css-suffix-file-read
    title: Request path ending in %3f.1.1.1.1a-1.css (CVE-2024-38475 file read)
    type: log_regex
    tier: possible
    evidence_class: web-logs
    sigma: [06-sonicwall-sma/sma_cve_2024_38475_css_suffix_read.yml]
    sources:
      files: ["**/httpd.log*", "**/*access*.log*", "**/http_request.log*"]
    pattern: '%3f\.1\.1\.1\.1a-1\.css'
    flags: [ignorecase]
    attack: [T1190, T1539]
    notes: >-
      watchTowr's reproduction appended this suffix to read arbitrary files,
      including /tmp/temp.db, which holds active session identifiers. A hit on
      temp.db means sessions must be treated as stolen. Single-source. The literal
      is only the reproduction's choice of digits; sma-38475-css-suffix-generalised
      covers the rest of what the rewrite rule accepts.

  - id: sma-38475-css-suffix-generalised
    title: Encoded ? followed by any suffix the abused .css rewrite rule accepts (CVE-2024-38475)
    type: log_regex
    tier: possible
    evidence_class: web-logs
    sources:
      files: ["**/httpd.log*", "**/*access*.log*", "**/http_request.log*"]
    pattern: '%3f\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9]*-[0-9]+[^ ]*\.css'
    exclude: ['%3f\.1\.1\.1\.1a-1\.css']
    flags: [ignorecase]
    attack: [T1190, T1539]
    notes: >-
      Generalised by this toolkit from the Apache RewriteRule watchTowr shows
      being abused (four dot-separated numbers, optional letters, a hyphen and a
      number before .css, rewritten to the bare .css path), with its example
      request "GET /tmp/temp.db%3f.1.1.1.1a-1.css".
      Any digits and letters that satisfy the rule work, so the published literal
      catches only the reproduction. The literal itself is excluded here and
      reported by sma-38475-css-suffix-file-read.
