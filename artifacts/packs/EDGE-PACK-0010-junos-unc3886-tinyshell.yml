# Detection pack EDGE-PACK-0010
# Schema: ../schema/pack.schema.json

id: EDGE-PACK-0010
name: Juniper Junos UNC3886 TINYSHELL backdoors
platforms: [EDGE-0008]
cves: [CVE-2025-21590]
actors: [UNC3886]
implants: [appid, to, irad, lmpad, jdosd, oemd]
summary: >-
  Six TINYSHELL-based backdoors on Juniper MX routers, with binary names one
  character off from legitimate daemons. UNC3886 got past veriexec by injecting
  code into a hijacked legitimate process (cat) - tracked as CVE-2025-21590,
  which needs a local attacker with shell access. Its session scripts backed up
  and edited the login records, deleted log lines containing "root", edited the
  runtime syslog.conf to send all logging to /dev/null, and restored most of it
  on exit, so on-box traces are
  thin by design. Mandiant noted the affected routers ran end-of-life hardware
  and software.
confidence: high
references:
  - title: Mandiant - China-nexus espionage targets Juniper routers (12 March 2025)
    url: https://cloud.google.com/blog/topics/threat-intelligence/china-nexus-espionage-targets-juniper-routers
    accessed: "2026-10-22"
  - title: NVD - CVE-2025-21590
    url: https://nvd.nist.gov/vuln/detail/CVE-2025-21590
    accessed: "2026-10-22"

detect:
  - id: junos-unc3886-masquerade-proc
    title: Process with a UNC3886 backdoor binary name
    type: log_regex
    tier: possible
    evidence_class: process
    sources:
      steps: [show_processes]
    pattern: '\s(appid|irad|lmpad|jdosd|oemd|to)\s*$'
    attack: [T1036.005, T1205]
    notes: >-
      Mandiant names the binaries but never shows them in a process listing; the
      documented execution ran inside a hijacked cat process. Exact names only -
      the real daemons are appidd, irsd, lmpd, jddosd, oamd and top. Newer
      releases may print threads as name{thread}, which this does not match.

  - id: junos-hijacked-cat-process
    title: cat process in the process table
    type: log_regex
    tier: possible
    evidence_class: process
    sources:
      steps: [show_processes]
    pattern: '\scat\s*$'
    attack: [T1055]
    notes: >-
      Mandiant's documented injection ran lmpad inside a cat process kept alive
      on a FIFO. A cat that outlives a command is unusual on a router, but an
      operator's own shell can produce one; read with the session list.

  - id: junos-unc3886-tmp-files
    title: UNC3886 file names in /var/tmp
    type: log_regex
    tier: possible
    evidence_class: filesystem
    sources:
      steps: [listing_var_tmp]
    pattern: '\s(pfed_jdhcp6_trace\.log(\.bak)?|rts)[*/|@=]?\s*$'
    attack: [T1074.001]
    notes: >-
      The two names Mandiant places in /var/tmp. The actor's commands deleted
      pfed_jdhcp6_trace.log and its .bak after each use, and the name mimics a
      daemon trace file, so possible only - confirm with the content.

  - id: junos-unc3886-payload-files
    title: UNC3886 payload file name in any listing
    type: log_regex
    tier: likely
    evidence_class: filesystem
    sources:
      steps: [listing_var_tmp, listing_var_log, listing_config_dir, listing_db_config, listing_mfs_etc]
    pattern: '\s(ldb\.b64|ldb\.tar\.gz|loader\.bin|pc\.bin|payload\.bin)[*/|@=]?\s*$'
    attack: [T1105, T1055]
    notes: >-
      These sat in a working directory named ldb whose location Mandiant does not
      give, and the actor deleted it. A hit is strong; no hit means little.

  - id: junos-unc3886-null-fifo
    title: FIFO named null
    type: log_regex
    tier: likely
    evidence_class: filesystem
    sources:
      steps: [listing_var_tmp, listing_var_log, listing_config_dir, listing_db_config, listing_mfs_etc]
    pattern: '^\s*p[rwx-]{9}.*\snull[*/|@=]?\s*$'
    attack: [T1055]
    notes: The injection wrote through a FIFO named null held open by the hijacked cat. Same caveat as the payload files.

  - id: junos-login-record-backups
    title: Backup copies of the login records
    type: log_regex
    tier: likely
    evidence_class: persistence
    sources:
      steps: [listing_var_log]
    pattern: '\s(wtmp0|utx\.log0)[*/|@=]?\s*$'
    attack: [T1070.002]
    notes: >-
      UNC3886's scripts copied wtmp and utx.log aside before editing them. wtmp0
      was deleted on a clean exit, so it means an interrupted session; utx.log0
      was left behind. Either means the live records may have been altered.

  - id: junos-syslog-conf-backup
    title: Backup of the runtime syslog.conf
    type: log_regex
    tier: likely
    evidence_class: persistence
    sources:
      steps: [listing_mfs_etc]
    pattern: '\ssyslog\.conf0[*/|@=]?\s*$'
    attack: [T1562.006]
    notes: >-
      UNC3886's pre_ssh script copied /mfs/var/etc/syslog.conf to syslog.conf0
      and redirected all logging to /dev/null; post_ssh restored it and deleted
      syslog.conf0. A leftover copy means an interrupted session. The path is
      from one Mandiant report and not confirmed on other releases.

  - id: junos-usage-db
    title: usage_db file in a configuration directory
    type: log_regex
    tier: possible
    evidence_class: persistence
    sources:
      steps: [listing_config_dir, listing_db_config]
    pattern: '\susage_db[*/|@=]?\s*$'
    attack: [T1074.001]
    notes: >-
      Tar archives of juniper.conf files that the actor's scripts created and
      then deleted, so present only after an interrupted session. Not confirmed
      to be absent on clean devices, so possible only.

  - id: junos-cli-start-shell
    title: CLI user started a shell
    type: log_regex
    sigma: [09-juniper-junos/junos_shell_started_from_cli.yml]
    tier: possible
    evidence_class: auth-logs
    sources:
      steps: [log_interactive]
    pattern: "UI_CMDLINE_READ_LINE: .*command 'start shell"
    attack: [T1059.004]
    notes: >-
      CVE-2025-21590, the veriexec bypass UNC3886 used, needs shell access, and
      Juniper's mitigation is to restrict shell to trusted users. Administrators
      and JTAC use the shell too, so every hit needs an owner. UNC3886 deleted
      log lines containing "root", so absence here is weak evidence.

  - id: junos-unc3886-tinyshell-yara
    title: TINYSHELL backdoor strings in a recovered file
    type: yara
    tier: confirmed
    evidence_class: persistence
    rule: 09-juniper-junos/junos_unc3886_tinyshell.yar
    sources:
      files: ["**"]
    attack: [T1205, T1573]
    notes: Evaluated against files recovered through JTAC or ingested images; the CLI cannot read the binaries.
