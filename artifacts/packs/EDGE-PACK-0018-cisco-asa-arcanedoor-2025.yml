# Detection pack EDGE-PACK-0018

id: EDGE-PACK-0018
name: Cisco ASA / FTD ArcaneDoor 2025-2026 (CVE-2025-20333, CVE-2025-20362)
platforms: [EDGE-0005]
cves: [CVE-2025-20333, CVE-2025-20362]
actors: [UAT4356]
implants: [RayInitiator, LINE VIPER, FIRESTARTER]
summary: >-
  The 2025 follow-on to ArcaneDoor chained a VPN web server authorisation bypass
  with remote code execution. Cisco assesses with high confidence it is the same
  actor. On ASA 5500-X models without Secure Boot it persisted below the
  operating system; in April 2026 Cisco disclosed an FXOS-level persistence
  mechanism (Talos names the backdoor FIRESTARTER) on Firepower and Secure
  Firewall hardware that survives upgrades and reloads. The in-memory payload
  LINE VIPER (NCSC) suppresses syslog IDs 302013, 302014, 609002 and 710005 and -
  unlike LINE DANCER - leaves no split lina region, so an unsplit region map does
  not clear a device; Cisco separately reports the actor disabled checkheaps.
  CISA's ED 25-03 grep of the lina text section is the on-box implant check;
  RayInitiator itself still needs a core dump. Absence of the suppressed syslog
  IDs is an off-box hunt, not an on-box check.
confidence: high
references:
  - title: Cisco - Detection guide for continued attacks against Cisco firewalls (v1.2, 24 April 2026)
    url: https://sec.cloudapps.cisco.com/security/center/resources/detection_guide_for_continued_attacks
    accessed: "2026-10-23"
  - title: Cisco Event Response - Continued attacks against Cisco firewalls
    url: https://sec.cloudapps.cisco.com/security/center/resources/asa_ftd_continued_attacks
    accessed: "2026-10-23"
  - title: Cisco - Continued evolution of persistence mechanism (cisco-sa-asaftd-persist-CISAED25-03, v1.3)
    url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-persist-CISAED25-03
    accessed: "2026-10-23"
  - title: CISA - Supplemental Direction ED 25-03 - Core Dump and Hunt Instructions (updated 24 April 2026)
    url: https://www.cisa.gov/news-events/directives/supplemental-direction-ed-25-03-core-dump-and-hunt-instructions
    accessed: "2026-10-23"
  - title: Cisco Talos - UAT-4356 FIRESTARTER
    url: https://blog.talosintelligence.com/uat-4356-firestarter/
    accessed: "2026-10-23"
  - title: NCSC - RayInitiator and LINE VIPER malware analysis report (v1.1)
    url: https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/RayInitiator-LINE-VIPER/ncsc-mar-rayinitiator-line-viper.pdf
    accessed: "2026-10-23"

detect:
  - id: asa-lina-text-implant-grep
    title: CISA's implant byte sequence found in the lina text section
    type: log_regex
    tier: likely
    evidence_class: memory
    sources:
      steps: [lina_text_implant_grep]
    # The echoed command carries the same hex groups; it is the only line with "grep".
    pattern: '55534154 41554156 41575756 488bb3a0'
    exclude: ['\bgrep\b']
    flags: [ignorecase]
    attack: [T1601.001, T1620]
    notes: >-
      CISA ED 25-03 Supplemental Direction: "Any output from this command is an
      indicator of compromise." CISA's RayDetect README says Part One, Section One
      of the instructions determines "if there is evidence of LineViper presence
      on the device". Held at likely rather than confirmed because CISA does not
      publish the command's output and the toolkit has not seen it; any matching
      line is to be reported to CISA. No output does not clear the device.

  - id: asa-fxos-lina-cs-process
    title: lina_cs process present (FXOS persistent implant)
    type: log_regex
    tier: likely
    evidence_class: process
    sources:
      steps: [show_kernel_lina_cs]
    # A process row starts with numeric PID columns; the echoed command does not.
    pattern: '^\s*\d+\s+\d+\s.*\slina_cs\s*$'
    attack: [T1543, T1542]
    notes: >-
      Cisco: any output from show kernel process | include lina_cs means the
      device "is considered compromised". Held at likely, not confirmed, because
      Cisco also documents the legitimate lina_cs getting stuck: run verify
      disk0:/asdm.bin and the command again before concluding. The name can
      change between implant builds, so no output is not a clean result. A cold
      restart removes the implant; shutdown, reboot and reload do not.

  - id: asa-firmware-update-log
    title: firmware_update.log on disk0
    type: log_regex
    tier: likely
    evidence_class: persistence
    sources:
      steps: [dir_disk0]
    pattern: '\bfirmware_update\.log\s*$'
    attack: [T1542.001]
    notes: >-
      On ASA 5512-X, 5515-X, 5525-X, 5545-X and 5555-X, booting 9.12.4.72 or
      9.14.4.28 checks ROMMON, removes the persistence mechanism if found, and
      writes this file. Cisco: its existence "could indicate that the device was
      compromised prior to the upgrade"; open a TAC case with show tech-support
      and the file. Cisco does not name the mechanism; NCSC names a GRUB bootkit
      on the same models RayInitiator. The toolkit does not equate the two.
      CISA's Supplemental Direction uses the same name, firmware_update.log, and
      adds the 5585-X to the model list.

  - id: asa-checkheaps-stalled
    title: Checkheaps counter did not advance
    type: check
    check: asa_checkheaps_stalled
    tier: possible
    evidence_class: memory
    sources:
      steps: [show_checkheaps, show_checkheaps_late]
    attack: [T1562.001]
    notes: >-
      Cisco reports the actor disabled checkheaps. Two readings at least five
      minutes apart is CISA's published procedure ("Wait at least five minutes,
      then run "show checkheaps" again"); no positive change in Total number of
      runs is "evidence of a potential compromise". The profile does not wait,
      so the hit reports the gap between its readings; the rule for gaps under
      five minutes is the toolkit's. A hit is a reason to repeat the procedure
      by hand, not a verdict.
