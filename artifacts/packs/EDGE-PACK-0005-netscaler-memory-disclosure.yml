# Detection pack EDGE-PACK-0005

id: EDGE-PACK-0005
name: NetScaler memory disclosure and session hijack (Citrix Bleed class)
platforms: [EDGE-0004]
cves: [CVE-2023-4966, CVE-2025-5777]
actors: []
implants: []
summary: >-
  Out-of-bounds reads that leak gateway memory, including session tokens that
  are then replayed to bypass MFA. Exploitation attempts surface as
  authentication-failure log lines carrying leaked, non-printable bytes. Success
  has to be shown elsewhere: the same session used from addresses or networks
  the user never had, and activity on the hosts behind the gateway.
confidence: high
references:
  - title: NetScaler - evaluating NetScaler logs for indicators of attempted exploitation of CVE-2025-5777
    url: https://www.netscaler.com/blog/news/evaluating-netscaler-logs-for-indicators-of-attempted-exploitation-of-cve-2025-5777/
    accessed: "2026-10-23"
  - title: Huntress - CitrixBleed 2 exploitation leading to ransomware
    url: https://www.huntress.com/blog/citrixbleed-2-dragonforce-ransomware
    accessed: "2026-10-22"
  - title: ReliaQuest - Citrix Bleed 2 threat spotlight (session reuse only)
    url: https://reliaquest.com/blog/threat-spotlight-citrix-bleed-2-vulnerability-in-netscaler-adc-gateway-devices/
    accessed: "2026-10-22"

detect:
  - id: netscaler-auth-nonprintable
    title: Authentication failure carrying leaked memory bytes
    type: check
    sigma: [04-citrix-netscaler/netscaler_cve_2025_5777_nonprintable_auth.yml]
    check: netscaler_auth_nonprintable
    tier: possible
    evidence_class: auth-logs
    attack: [T1190]
    notes: >-
      Two published forms. NetScaler: log lines containing "Authentication is
      rejected for" and "AAA Message" with "bytes containing non-ASCII characters
      (range 128-255)" - "these bytes may be escaped when viewed through a log
      viewer". Huntress: AAA LOGIN_FAILED events with "a bizarre, unprintable
      User value". Only the text after the marker is scored. ns.log rotates
      quickly; the vendor says logs "may only be available for a few days prior".
      Pull the syslog copy from your SIEM.
