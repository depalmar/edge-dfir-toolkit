detect:
  - id: sonicos-event-log-cleared
    title: SonicOS event log cleared (event 5, Log Cleared)
    type: log_regex
    tier: possible
    evidence_class: system-logs
    sigma: [12-sonicwall-sonicos/sonicos_log_cleared.yml]
    sources:
      files: ["**/sonicos-system-logs*", "**/sonicos-syslog*"]
    pattern: '\bLog Cleared\b'
    attack: [T1070]
    notes: >-
      Event 5's message is "Log Cleared" (Log Events reference), and the event is
      written after the clear, so it is in the export that follows. Arctic Wolf:
      "Threat actors commonly sought to delete firewall logs upon gaining access to
      compromised environments." An administrator may clear the log for ordinary
      reasons; the hit is a question for whoever holds the firewall's change
      record. Whatever was cleared is only in the syslog server's copy.

  - id: sonicos-wan-zone-admin-login
    title: Administrator login from the WAN zone (event 236)
    type: log_regex
    tier: possible
    evidence_class: auth-logs
    sigma: [12-sonicwall-sonicos/sonicos_wan_admin_login.yml]
    sources:
      files: ["**/sonicos-system-logs*", "**/sonicos-syslog*"]
    pattern: 'WAN zone administrator login allowed'
    attack: [T1133, T1078]
    notes: >-
      Event 236 (Log Events reference). SonicWall's workaround for CVE-2024-40766
      is "restricting firewall management to trusted sources or disabling firewall
      WAN management from Internet access", so a hardened firewall logs none of
      these. SonicWall's 2025 notice: with a compromised administrator account,
      "attackers may exploit administrative features such as packet capture,
      debugging, logging, configuration backup, or MFA control". Check the source
      address on each hit against the administrators' own; the toolkit has no
      published example of this event in an intrusion.
