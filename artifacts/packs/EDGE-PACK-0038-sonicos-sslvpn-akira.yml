# Detection pack EDGE-PACK-0038

id: EDGE-PACK-0038
name: SonicOS SSL VPN account abuse, Akira and Fog (CVE-2024-40766), 2024-2025
platforms: [EDGE-0012]
cves: [CVE-2024-40766]
actors: [EDGE-TA-0009]
summary: >-
  From August 2024 and again from 21 July 2025, Akira and Fog intrusions began
  with SSL VPN logins to SonicWall firewalls using valid credentials, mostly from
  hosting-provider addresses. SonicWall marked CVE-2024-40766 "potentially being
  exploited in the wild" and later wrote it had "high confidence" the 2025
  activity was "not connected to a zero-day vulnerability" but correlated with
  that CVE and with local passwords carried over from Gen 6 migrations and never
  reset. Arctic Wolf found no definitive evidence of the CVE in the 2024
  intrusions it investigated, and AA24-109A says Akira "likely" abused it. The
  logins themselves look like any other, so whether one was malicious is a hunt
  against where it came from (EDGE-HUNT-0029 to 0031). On the box, the toolkit
  checks the two things that should not happen on a hardened firewall: the
  event log cleared, and an administrator login from the WAN zone.
confidence: medium
