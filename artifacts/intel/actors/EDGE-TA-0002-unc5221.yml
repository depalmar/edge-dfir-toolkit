  UTA0178 is a Chinese nation-state-level threat actor." Volexity's UTA0178
  indicators (EDGE-IOC-0002) and the 2024 web shells (EDGE-IMP-0006) are
  linked here because both reporters describe the same January 2024 Ivanti
  exploitation, not because either equates the clusters.
