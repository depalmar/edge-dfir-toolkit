id: EDGE-TA-0002
name: UNC5221
aliases: []
reported_by: [Mandiant / Google Threat Intelligence Group]
link_confidence: medium
stated_confidence: >-
  Mandiant (January 2024): "a suspected espionage threat actor, currently being
  tracked as UNC5221" and "At the time of publication, Mandiant had not linked
  this activity to a previously known group, nor do we currently have enough
  data to assess the origin of this threat actor." GTIG (April 2025): "UNC5221
  is a suspected China-nexus espionage actor".
state_nexus: "China (GTIG 2025: 'suspected China-nexus'; Mandiant made no origin assessment in January 2024)"
motivation: espionage
summary: >-
  Exploited Ivanti Connect Secure zero-days in January 2024 (CVE-2023-46805,
  CVE-2024-21887) and again in 2025 (CVE-2025-0282, then CVE-2025-22457 as an
  n-day), deploying web shells and the SPAWN family. GTIG attributes the
  BRICKSTORM activity "to UNC5221 and closely related, suspected China-nexus
  threat clusters". Volexity reported the January 2024 Ivanti exploitation
  under its own name, UTA0178. Third parties equate UTA0178 with UNC5221;
  neither Mandiant nor Volexity does in the posts read, so UTA0178 is not
  listed as an alias and the toolkit does not merge the two.
platforms: [EDGE-0003]
packs: [EDGE-PACK-0007, EDGE-PACK-0029]
implants: [EDGE-IMP-0005, EDGE-IMP-0006]
tradecraft:
  - Authentication bypass chained with command injection
  - Web shells written into legitimate CGI, Perl and Python components
  - Trojanized legitimate components; THINSPOOL attempted to evade the Integrity Checker (Mandiant observed the attempt fail)
  - Credential harvesting from the appliance and the connected directory
  - "Long dwell: BRICKSTORM intrusions stayed undetected 'for 393 days, on average' (GTIG, 2025)"
victimology:
  - "'a wide range of countries and verticals' (GTIG, 2025)"
  - "BRICKSTORM: technology and legal sectors and SaaS providers (GTIG, 2025)"
first_seen: "2023-12"
