notes: >-
  Motivation is recorded as unknown because the schema has no "criminal" value;
  Volexity's own words are in stated_confidence (low confidence, criminal rather
  than espionage). Volexity found the activity "In the first week of October 2026".
  EDGE-PACK-0026 covers on-disk leftovers in /data/.icscap and
  /home/runtime/tmp; the exploit itself (X-DSCGI-PATH on welcome.cgi, visible
  only to a proxy that logs headers) and the transient in-memory patch are not
  covered.
