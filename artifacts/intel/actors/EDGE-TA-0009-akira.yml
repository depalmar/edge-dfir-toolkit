notes: >-
  first_seen is AA24-109A's "Since March 2023" for Akira overall; it dates the
  operation, not any CVE. Motivation is AA24-109A's: "Akira threat actors use a
  double extortion model for financial gain." Fog is not merged in: Arctic Wolf
  reports Fog and Akira intrusions side by side (about 75% Akira) and notes
  shared VPS addresses, but does not say they are one actor. Huntress at first
  called the 2025 cause "A likely zero-day vulnerability in SonicWall VPNs";
  SonicWall later wrote it had "high confidence" it was not, and Arctic Wolf
  found no evidence of exploitation of CVE-2024-40766 in the 2024 intrusions it
  investigated. The July 2026 credential stuffing Huntress reported names no
  actor and is not linked here.
