id: EDGE-TA-0009
name: Akira
aliases: []
reported_by: [Arctic Wolf Labs, Huntress, "FBI, CISA and co-sealers (AA24-109A)", "ASD's ACSC"]
link_confidence: medium
stated_confidence: >-
  Each party in its own words. Arctic Wolf (September 2025): "Since late July
  2025, Arctic Wolf has observed an ongoing surge in Akira ransomware activity
  targeting SonicWall firewalls through malicious SSL VPN logins." Huntress
  (August 2025): "right before deploying what we assess to be Akira ransomware".
  AA24-109A (updated 13 November 2025): "Akira threat actors likely abused
  Common Vulnerabilities and Exposures (CVE)-2024-40766 ... a SonicWall
  vulnerability, for initial access." ASD's ACSC (September 2025): "We are aware
  of the Akira ransomware targeting vulnerable Australian organisations through
  SonicWall SSL VPNs."
motivation: financial
summary: >-
  A ransomware operation that four parties tie to SonicWall SSL VPN logins in
  2024 and 2025. Arctic Wolf saw Akira and Fog intrusions skew to SonicWall from
  August 2024, through local SSL VPN accounts from hosting-provider addresses,
  and a second wave from 21 July 2025 in which logins succeeded against accounts
  with OTP enabled and ransomware followed in as little as an hour. Huntress saw
  the 2025 wave from 25 July. SonicWall ties the 2025 activity to CVE-2024-40766
  and to local passwords carried over from Gen 6 migrations and never reset;
  AA24-109A says Akira "likely" abused the CVE. How the actors passed MFA was not
  established: Arctic Wolf found "the use of valid credentials rather than
  modification of OTP configuration" but could not say how.
platforms: [EDGE-0012]
packs: [EDGE-PACK-0038]
implants: []
tradecraft:
  - SSL VPN logins with valid credentials from VPS and hosting-provider addresses, sometimes privacy VPNs
  - Logins on accounts never meant for the VPN, including the directory synchronisation account
  - Many accounts logging in from one address in quick succession, which Arctic Wolf reads as scripted
  - Internal scanning within minutes of the VPN login, then ransomware within hours
  - Deleting firewall logs after access (Arctic Wolf, 2024)
victimology:
  - "AA24-109A: \"a wide range of businesses and critical infrastructure entities in North America, Europe, and Australia\""
first_seen: "2023-03"
