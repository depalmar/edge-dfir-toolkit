id: EDGE-TA-0006
name: UNC3886
aliases: []
reported_by: [Mandiant / Google Threat Intelligence Group]
link_confidence: medium
stated_confidence: "Mandiant: 'Mandiant attributed these backdoors to the China-nexus espionage group, UNC3886' and 'a highly adept China-nexus cyber espionage group that has historically targeted network devices and virtualization technologies with zero-day exploits' (2025, Juniper); for the 2023 FortiOS activity Mandiant's words were 'Mandiant attributes this activity to UNC3886, a group we suspect has a China-nexus'"
state_nexus: China (as assessed by the reporter)
motivation: espionage
summary: >-
  Deployed six TINYSHELL-based backdoors on Juniper MX routers, found in mid
  2024 and reported in March 2025. It got past veriexec by injecting code into
  the memory of a legitimate process (tracked as CVE-2025-21590, which needs a
  local attacker with shell access). Mandiant noted the affected routers ran
  end-of-life hardware and software, and saw no successful use of veriexec
  bypasses Juniper had already addressed in supported releases. Mandiant also
  states it found no technical overlap with activity reported as Volt Typhoon
  or Salt Typhoon. The group's earlier reporting covers FortiOS and VMware ESXi.
platforms: [EDGE-0008, EDGE-0002]
packs: [EDGE-PACK-0010, EDGE-PACK-0024]
implants: [EDGE-IMP-0010]
tradecraft:
  - Backdoors named to resemble legitimate daemons
  - Process injection to get past veriexec
  - lmpad backdoor deleted log lines containing "root" and, through its embedded script, redirected logging to /dev/null in the runtime syslog.conf (malware behaviour, not hands-on)
  - lmpad's embedded script copied login records and the commit database aside and restored them after the session
  - Hands-on, by the operator - built the injection payload with a here document (ldb.b64) and injected lmpad into a hijacked cat process
victimology: ["defence, technology and telecommunications organisations, mainly in the US and Asia (Mandiant)"]
first_seen: "2022 (first Mandiant reporting on the group's malware; no first-seen date given)"
references:
