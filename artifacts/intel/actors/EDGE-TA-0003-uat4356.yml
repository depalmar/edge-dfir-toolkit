id: EDGE-TA-0003
name: UAT4356
aliases: [UAT-4356, "STORM-1849 (Microsoft's name, as given by Talos)"]
reported_by: [Cisco Talos]
link_confidence: medium
stated_confidence: "Cisco Talos: 'we assess with high confidence that these actions were performed by a state-sponsored actor'; Talos did not attribute to a specific government"
state_nexus: "not stated by the reporter"
motivation: espionage
summary: >-
  ArcaneDoor: exploitation of Cisco ASA and FTD devices disclosed in April 2024
  (CVE-2024-20353, CVE-2024-20359) with the memory-resident LINE DANCER and the
  disk-persistent LINE RUNNER. Cisco and CISA tied the 2025 activity
  (CVE-2025-20333, CVE-2025-20362, RayInitiator, LINE VIPER) to the same
  campaign. In April 2026 Talos reported UAT-4356's continued targeting of
  Firepower devices and its FXOS backdoor FIRESTARTER.
platforms: [EDGE-0005]
packs: [EDGE-PACK-0006, EDGE-PACK-0018]
implants: [EDGE-IMP-0002, EDGE-IMP-0003, EDGE-IMP-0004, EDGE-IMP-0013]
tradecraft:
  - Memory-only shellcode interpreter that disabled syslog and bypassed AAA
  - Hooked the core-dump routine so that a dump request reloaded the device
  - Boot-loader persistence on models without Secure Boot (2025)
  - FXOS backdoor (FIRESTARTER) that rewrites itself to disk during a graceful reboot (2026)
  - Packet capture and configuration exfiltration from the device
victimology: ["government networks (Talos)"]
notes: >-
  first_seen is the actor-controlled infrastructure Talos dates to early
  November 2023; Talos also saw evidence the capability was "being tested and
  developed as early as July 2023".
first_seen: "2023-11"
