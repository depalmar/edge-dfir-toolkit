id: EDGE-IMP-0001
name: UPSTYLE
platforms: [EDGE-0001]
actors: [EDGE-TA-0001]
cves: [CVE-2024-3400]
type: backdoor
resides: disk
survives_reboot: "yes"
survives_upgrade: unknown
summary: >-
  Python backdoor installed after CVE-2024-3400 exploitation. A .pth file in
  site-packages runs when the interpreter starts. The payload watched the SSL
  VPN nginx error log for requests carrying an encoded command, ran it, wrote
  the output into a portal CSS file, then removed its log lines and restored
  timestamps.
artifacts:
  - /usr/lib/python3.6/site-packages/system.pth
  - /var/appweb/sslvpndocs/global-protect/portal/css/bootstrap.min.css
  - sslvpn_ngx_error.log (command channel; lines deleted afterwards)
anti_forensics:
  - Deletes its own entries from sslvpn_ngx_error.log
  - Restores timestamps on the modified CSS file
detections: [panos-3400-upstyle-pth, panos-3400-upstyle-yara]
confidence: high
references:
  - title: Volexity - zero-day exploitation of CVE-2024-3400
    url: https://www.volexity.com/blog/2024/04/12/zero-day-exploitation-of-unauthenticated-remote-code-execution-vulnerability-in-globalprotect-cve-2024-3400/
    accessed: "2026-10-22"
