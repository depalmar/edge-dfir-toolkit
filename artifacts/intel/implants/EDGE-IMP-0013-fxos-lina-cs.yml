id: EDGE-IMP-0013
name: FIRESTARTER
aliases: [FXOS lina_cs implant]
platforms: [EDGE-0005]
actors: [EDGE-TA-0003]
cves: [CVE-2025-20333, CVE-2025-20362]
type: backdoor
resides: memory+disk
survives_reboot: "yes"
survives_upgrade: "yes"
survives_factory_reset: unknown
summary: >-
  A backdoor with a persistence mechanism in the FXOS base operating system under
  ASA and FTD on Firepower 1000, 2100, 4100, 9300 and Secure Firewall 1200, 3100
  and 4200, disclosed by Cisco in April 2026 after a CISA ED 25-03 update; Talos
  names it FIRESTARTER and says it "allows remote access and control to execute
  arbitrary code inside the LINA process". It is preserved across upgrading to
  the September 2025 fixed releases and runs as a process named lina_cs. Talos -
  "The persistence mechanism triggers during graceful reboot", writing itself to
  a backup file named svc_samcore.log (full path under artifacts) and updating
  CSP_MOUNT_LIST to copy itself back to /usr/bin/lina_cs; "a hard reboot (for example, after the
  device has been unplugged from power) effectively removes the implant". Cisco
  recommends reimaging and upgrading; it lists a cold restart as a not-recommended
  alternative. ASA 5500-X, ASAv and FTDv are not affected. CISA says a device
  whose core dump shows compromise should stay powered on and be disconnected.
artifacts:
  - show kernel process | include lina_cs
  - /usr/bin/lina_cs (FXOS / expert-mode path; not visible from the ASA CLI)
  - /opt/cisco/platform/logs/var/log/svc_samcore.log (FXOS / expert-mode path; not visible from the ASA CLI)
anti_forensics:
  - Survives warm reloads and software upgrades
  - Rewrites itself to disk only during a graceful reboot
detections: [asa-fxos-lina-cs-process]
gap: >-
  The two file paths Talos lists are in the FXOS base operating system; the
  profile has no read-only command that lists them, so only the process check
  runs.
confidence: high
references:
  - title: Cisco Talos - UAT-4356 FIRESTARTER (23 April 2026)
    url: https://blog.talosintelligence.com/uat-4356-firestarter/
    accessed: "2026-10-23"
  - title: CISA and NCSC - AR26-113A FIRESTARTER Backdoor (23 April 2026)
    url: https://www.cisa.gov/news-events/analysis-reports/ar26-113a
    accessed: "2026-10-23"
  - title: Cisco - Continued evolution of persistence mechanism (cisco-sa-asaftd-persist-CISAED25-03, v1.3)
    url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-persist-CISAED25-03
    accessed: "2026-10-23"
