id: EDGE-IMP-0010
name: UNC3886 Junos TINYSHELL backdoors
aliases: [appid, to, irad, lmpad, jdosd, oemd]
platforms: [EDGE-0008]
actors: [EDGE-TA-0006]
cves: [CVE-2025-21590]
type: backdoor
resides: memory+disk
survives_reboot: unknown
survives_upgrade: unknown
summary: >-
  Six TINYSHELL-based backdoors found on Juniper MX routers in mid 2024, each
  named one character off from a legitimate daemon (appid / appidd, to / top,
  irad / irsd, lmpad / lmpd, jdosd / jddosd, oemd / oamd). appid and to are
  active and beacon to command servers on TCP/22; irad listens passively with a
  libpcap filter for an ICMP trigger; lmpad, jdosd and oemd listen on UDP or TCP
  ports (irad can also listen passively on TCP). The documented execution
  injected lmpad into a hijacked cat process to get past veriexec; Mandiant
  says that loader does not support running the others.
artifacts:
  - Binary names appid, to, irad, lmpad, jdosd, oemd (no process listing published; the injected payload ran inside cat)
  - Payload files ldb.b64 and ldb.tar.gz (location not given), and loader.bin, pc.bin, payload.bin and a FIFO named null in a directory the actor removed afterwards (location not given)
  - /var/tmp/pfed_jdhcp6_trace.log(.bak) (deleted after use) and /var/tmp/rts
  - utx.log0 in /var/log (left behind by lmpad's script); wtmp0 and /mfs/var/etc/syslog.conf0 only if its post_ssh never ran
  - /config/usage_db, /var/db/config/usage_db, /var/rundb+ and /usr/lib/libjucomm.so.1 between lmpad's backup and restore commands
  - Mandiant-published SHA-256 hashes, magic values and command-server addresses (see the reference)
anti_forensics:
  - Deleted log lines containing "root" from interactive-commands, messages and auth (lmpad command 2)
  - Redirected logging to /dev/null in the runtime syslog.conf, restored on exit (lmpad's embedded script)
  - Copied the commit database aside and restored it, rewinding commit history (lmpad's embedded script)
  - Wrote to snmpd process memory with dd
  - Injected into legitimate processes to evade veriexec
detections: [junos-unc3886-masquerade-proc, junos-hijacked-cat-process, junos-unc3886-tmp-files, junos-unc3886-payload-files, junos-unc3886-null-fifo, junos-login-record-backups, junos-syslog-conf-backup, junos-usage-db, junos-unc3886-tinyshell-yara, junos-tinyshell-mandiant-hunting]
confidence: high
