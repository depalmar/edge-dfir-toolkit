id: EDGE-IMP-0012
name: c05d5254
platforms: [EDGE-0010]
actors: []
cves: [CVE-2025-53521]
type: web-shell
resides: memory+disk
survives_reboot: unknown
survives_upgrade: unknown
summary: >-
  F5's name for the malware deployed after CVE-2025-53521 exploitation on
  BIG-IP APM. Webshells ran in memory, so served PHP files may be unchanged. It
  left runtime files under /run, set SELinux to permissive, modified system
  binaries including the ones F5's integrity check uses, and drove the device
  through REST calls to util/bash as f5hubblelcdadmin. F5 says its traffic
  disguised activity with HTTP 201 or 401 responses carrying a CSS content type.
artifacts:
  - /run/bigtlog.pipe and /run/bigstart.ltm
  - Hash or size changes in /usr/bin/umount, /usr/sbin/httpd, /usr/sbin/chroot, /usr/libexec/apmd64, /usr/bin/sys-icheck, /usr/libexec/sys-eicheck.py, /etc/rc.d/rc.local
  - restjavad-audit POST to /mgmt/tm/util/bash as local/f5hubblelcdadmin
  - auditd "received setenforce notice (enforcing=0)"
anti_forensics:
  - Tampered with sys-icheck and sys-eicheck.py
  - In-memory webshells leave served files unmodified
  - SELinux set to permissive
detections: [f5-c05d5254-runtime-files, f5-c05d5254-pipe-open, f5-selinux-not-enforcing, f5-selinux-permissive-domains, f5-setenforce-zero, f5-hubble-util-bash-rest, f5-hubble-util-bash-audit]
gap: >-
  Binary tampering is only visible to F5 System Scanner (downloaded from MyF5, manifest checked with sha512sum, and run on the device from /var/tmp/scanner (F5 K000160515)), which the toolkit
  records as a manual step and ingests but does not run. F5 does not say the
  scanner's process scan detects the in-memory webshells.
confidence: high
references:
