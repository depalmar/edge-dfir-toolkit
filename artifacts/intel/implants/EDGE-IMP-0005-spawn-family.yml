id: EDGE-IMP-0005
name: SPAWN family
aliases: [SPAWNANT, SPAWNMOLE, SPAWNSNAIL, SPAWNSLOTH]
platforms: [EDGE-0003]
actors: [EDGE-TA-0002]
cves: [CVE-2025-0282, CVE-2025-22457]
type: backdoor
resides: disk
survives_reboot: "yes"
survives_upgrade: "yes"
survives_factory_reset: unknown
summary: >-
  Modular Ivanti Connect Secure implant set: an installer that persists across
  upgrades, a tunneler, an SSH backdoor and a log-tampering component. The
  installer recalculated file hashes and re-signed the Integrity Checker Tool
  manifest so the tool reported clean. The log-tampering component, SPAWNSLOTH,
  "targets the dslogserver process to disable both local logging and remote
  syslog forwarding" (GTIG). The iptables syslog block and the read-write root
  remount were steps of UNC5221's exploit and script for CVE-2025-0282, not the
  malware. First described by Mandiant in 2024 (Cutting Edge Part 4); GTIG's
  January 2025 post says Mandiant previously attributed the SPAWN ecosystem to
  UNC5337, and its April 2025 post calls it "attributed to UNC5221". The cves
  listed are the 2025 entry points; the 2024 deployments followed the
  CVE-2023-46805 / CVE-2024-21887 chain.
artifacts:
  - ICT manifest and signing-key changes
  - iptables DROP rules on the syslog ports (exploit script, not the malware)
  - Root filesystem remounted read-write; SELinux disabled (exploit script steps)
anti_forensics:
  - Re-signed the ICT manifest (SPAWNANT)
  - Disabled local logging and remote syslog forwarding by targeting dslogserver (SPAWNSLOTH)
detections: [ivanti-spawn-family-yara, ivanti-spawn-library-names, ivanti-2025-dropper-files-in-tmp, ivanti-phasejam-backup-copies, ivanti-ict-integrity-events]
gap: >-
  Every file-based detection needs the root filesystem, which a customer
  reaches only through a VM snapshot, the external ICT's snapshot or a
  vendor-assisted image; on a physical appliance without Ivanti's help they
  report not evaluated. The ICT events are the only on-box log signal, and the
  actor re-hashed the ICT manifest to keep them quiet. The off-box syslog gap
  remains the customer-visible signal SPAWNSLOTH creates by disabling remote
  forwarding.
confidence: medium
