staleness: >-
  SonicWall added the list in revision 1.9 (4 November 2024), added addresses on 5 and 11 November, and in revision
  1.15 (20 November 2024) removed two it had added on 11 and 14 November; those two are not here. It calls the list
  "possible IoC" and names no actor, so the role is suspected. Parsed from the PSIRT API's copy of the advisory
  (https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2024-0015), which returns different
  bytes on each request, so there is no upstream hash to watch. Rented addresses change hands; check current ownership
  before blocking. SonicWall's own advice is Botnet Filtering, because "threat actor IP addresses are automatically
  added to the list".
