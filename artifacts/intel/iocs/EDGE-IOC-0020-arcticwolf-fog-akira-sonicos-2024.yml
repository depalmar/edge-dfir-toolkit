staleness: >-
  From 30 intrusions between early August and mid-October 2024; Akira was deployed in about 75% and Fog in the rest,
  and the table does not say which address belongs to which. Arctic Wolf: "we do not have definitive evidence of
  this vulnerability being exploited in the intrusions we investigated", so the CVE is listed because the devices
  ran affected firmware, not because the addresses exploited it. The addresses are VPN logins, remote-access and
  exfiltration endpoints, most from hosting providers; the hashes are of legitimate tools the actors brought (scanners,
  archivers, file transfer, remote access), so a match shows the tool, not the actor. Not here: file names, the
  two host names, the nine ASNs Arctic Wolf lists "Used for SSL VPN login" (EDGE-HUNT-0029 uses them), and three
  SHA-1 values one character short in the published table (WinRAR, OpenSSH, AV/EDR killer).
