staleness: >-
  January 2026. Fortinet locked the two malicious FortiCloud accounts on 2026-01-22 and says "We expect these
  addresses may change in the future". The login sources include Cloudflare-fronted addresses other people use,
  so the role of every address is unknown. The admin names are ones the actor chose; several are ordinary
  names, and Fortinet "recommends reviewing all admin accounts to look for any unexpected entries".
