staleness: >-
  First published 4 August 2025 and updated to 13 August (update 4 added hashes); Huntress dates its first case
  to 25 July. It then called the cause "A likely zero-day vulnerability in SonicWall VPNs"; SonicWall later wrote
  it had "high confidence" the activity was "not connected to a zero-day vulnerability", so no CVE is listed. The
  accounts and hashes are from Windows hosts behind the firewall, not from the firewall. Not here: the seven Windows
  file paths Huntress lists (the path type holds device paths), the eight ASN/CIDR rows Huntress calls "hosting
  adversary infrastructure" (EDGE-HUNT-0029 uses them) and three passwords it lists.
