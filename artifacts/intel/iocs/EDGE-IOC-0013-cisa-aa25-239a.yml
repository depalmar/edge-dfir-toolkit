staleness: >-
  The authoring agencies: "The following IP indicators were associated with the APT actors’ activity from August
  2021 to June 2025. Disclaimer: Several of these observed IP addresses were first observed as early as August
  2021 and may no longer be in use by the APT actors. The authoring agencies recommend organizations investigate
  or vet these IP addresses prior to taking action, such as blocking." The advisory does not say which addresses
  the actors own, so every address is role unknown. Version 1.1 (3 September 2025) records "one IP correction and
  two removals". The four file hashes are tools seen on staging hosts, not on the edge device.
