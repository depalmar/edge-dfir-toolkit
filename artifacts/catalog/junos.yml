# Edge platform catalog entry
# EDGE-0008 - Juniper Junos OS / Junos OS Evolved
# Schema: ../schema/platform.schema.json

id: EDGE-0008
name: Juniper Junos OS / Junos OS Evolved
vendor: Juniper Networks
products: [MX Series routers, SRX Series firewalls, PTX Series (Junos OS Evolved), vSRX]
os_base: Junos OS is based on a modified FreeBSD; Junos OS Evolved runs natively on Linux
filesystem: >-
  /config holds the live configuration and juniper.conf.1-3; /var/db/config
  holds juniper.conf.4.gz onward; /var/home holds user homes and SSH keys;
  /var/tmp holds staging and core files. Junos OS Evolved keeps configuration
  and state in its Distributed Data Store.
customer_shell: "yes"
memory_acquisition: not-available
profile: junos
response: junos
hardening: junos
collection:
  - method: Operational CLI over SSH, paging disabled per command with "| no-more"
    impact: none
    description: Version, processes, users, configuration, commit history, logs and directory listings, without entering the shell.
    confidence: high
  - method: JMRT integrity-check
    impact: vendor-bundle
    description: Checks that veriexec (Junos) or IMA (Evolved) is working. Writes and runs a test file and adds syslog entries, so it runs after log collection. Older releases (19.2 to 21.3) name it differently. Bypassed by UNC3886 through process injection, so a pass is one signal.
    confidence: medium
    references: [https://juniper.net/documentation/us/en/software/junos/security-services/topics/topic-map/using-the-juniper-malware-removal-tool.html]
  - method: request support information (printed, not saved)
    impact: vendor-bundle
    description: The JTAC bundle. `| save` would write a file and is refused by the guard.
    confidence: medium
  - method: JMRT quick-scan
    impact: break-glass
    description: Deletes malicious files and kills processes by default. Run last, with the clean action set to warn.
    confidence: high
volatility:
  - The injected payloads lived in process memory; that a reboot loses them is this toolkit's inference. Mandiant says the analysis "required novel methods for artifact acquisition and analysis"
  - Log lines are edited in place on a compromised device; the syslog receiver copy is the durable record
anti_forensics:
  - technique: Deleted every line containing "root" from interactive-commands, messages and auth logs with sed
    seen_in: UNC3886 (Mandiant, March 2025)
  - technique: Backed up and then edited the login records; wtmp0 deleted on exit, utx.log0 left behind
    seen_in: UNC3886 (Mandiant, March 2025)
  - technique: Redirected syslog to /dev/null by editing the runtime syslog.conf
    seen_in: UNC3886 (Mandiant, March 2025)
  - technique: Injected code into legitimate processes to get past veriexec
    seen_in: UNC3886 (tracked as CVE-2025-21590)
artifacts:
  - locator: show system processes extensive
    class: process
    volatility: live
    forensic_value: high
    evidence_type: [execution, defense-evasion]
    confidence: high
    collected_by: show_processes
    description: >-
      Mandiant names the backdoor binaries one character off from real daemons
      (appid, irad, lmpad, jdosd, oemd, to) but gives no process listing; the
      documented execution ran inside a hijacked cat process.
    seen_in: [UNC3886]
    provides: >-
      Running processes and their names.
    normal: >-
      The Junos daemons - appidd, irsd, lmpd, jddosd, oamd, top.
    suspicious: >-
      Exact names appid, irad, lmpad, jdosd, oemd or to, or a long-lived cat
      process.
    basis: researcher
  - locator: file list /var/tmp detail
    class: filesystem
    volatility: stable
    forensic_value: high
    evidence_type: [execution, persistence]
    confidence: high
    collected_by: listing_var_tmp
    description: >-
      pfed_jdhcp6_trace.log and rts are the names Mandiant places here. The
      payload files and the FIFO named null sat in a deleted working directory
      (ldb) whose location is not given.
    seen_in: [UNC3886]
    provides: >-
      The temporary directory listing.
    normal: >-
      Traces and cores you can account for.
    suspicious: >-
      pfed_jdhcp6_trace.log, rts, the payload names, or a FIFO named null.
    basis: researcher
  - locator: file list /var/log detail
    class: filesystem
    volatility: stable
    forensic_value: high
    evidence_type: [defense-evasion]
    confidence: high
    collected_by: listing_var_log
    description: utx.log0 is left behind by the actor's scripts; wtmp0 only after an interrupted session.
    seen_in: [UNC3886]
    provides: >-
      The log directory listing.
    normal: >-
      wtmp and utx.log.
    suspicious: >-
      utx.log0, or wtmp0 - left by the actor's scripts.
    basis: researcher
  - locator: show log interactive-commands
    class: auth-logs
    volatility: rotating
    forensic_value: high
    evidence_type: [execution, timeline]
    confidence: medium
    collected_by: log_interactive
    description: UI_CMDLINE_READ_LINE records of every CLI command. Edited by the actor; compare with the off-box copy.
    provides: >-
      Every CLI command with user and time.
    normal: >-
      Commands by known administrators.
    suspicious: >-
      start shell by anyone who should not have it, and gaps compared with the
      off-box copy.
    basis: vendor
  - locator: show log messages
    class: system-logs
    volatility: rotating
    forensic_value: high
    evidence_type: [initial-access, timeline]
    confidence: high
    collected_by: log_messages
    description: UI_LOGIN_EVENT, UI_AUTH_EVENT and sshd records. Gaps around root activity are the finding.
    provides: >-
      Logins, authentication and SSH events.
    normal: >-
      Continuous records for known users.
    suspicious: >-
      Gaps around root activity - UNC3886 deleted every line containing "root".
    basis: researcher
  - locator: show system commit
    class: config
    volatility: stable
    forensic_value: high
    evidence_type: [configuration, timeline]
    confidence: high
    collected_by: show_commits
    description: Who committed what and how (cli, other, autoinstall).
    provides: >-
      Commit history with user, time and method.
    normal: >-
      Commits that match change records.
    suspicious: >-
      Commits nobody owns, or made "via other".
    basis: toolkit
  - locator: show configuration | display set
    class: config
    volatility: stable
    forensic_value: high
    evidence_type: [configuration, persistence]
    confidence: medium
    collected_by: show_config
    description: Diff for logins, classes, scripts and syslog destinations.
    provides: >-
      The configuration as set commands.
    normal: >-
      Matches the backup.
    suspicious: >-
      New logins or classes, scripts, or a syslog host removed.
    basis: toolkit
  - locator: /config/usage_db and /var/db/config/usage_db
    class: persistence
    volatility: stable
    forensic_value: medium
    evidence_type: [persistence]
    confidence: medium
    collected_by: listing_config_dir
    description: Tar archives of juniper.conf files the actor's scripts created and then deleted. Not confirmed to be absent on clean devices.
    seen_in: [UNC3886]
    provides: >-
      Archives of configuration files.
    normal: >-
      Not confirmed absent on clean devices.
    suspicious: >-
      Present - the actor's scripts created and deleted them, so one left behind
      marks an interrupted session.
    basis: researcher
  - locator: Syslog receiver copies
    class: off-box
    volatility: off-box
    forensic_value: high
    evidence_type: [timeline, defense-evasion]
    confidence: high
    collected_by: ingest
    description: The only record the actor's log-line deletion and runtime /dev/null redirect did not reach. Silence from the device is itself evidence.
    provides: >-
      The record the actor's log deletion did not reach.
    normal: >-
      A continuous stream.
    suspicious: >-
      Silence from the device during the window.
    basis: researcher
  - locator: file list /var/jail detail recursive
    class: filesystem
    volatility: stable
    forensic_value: medium
    evidence_type: [initial-access, persistence]
    confidence: low
    unverified: true
    collected_by: listing_var_jail
    description: The chroot J-Web's PHP runs in. Which on-host directory a J-Web upload lands in is not confirmed, so the whole jail is listed.
    provides: >-
      Every file under the J-Web jail, with sizes and times.
    normal: >-
      Session files and the release's own content.
    suspicious: >-
      A file named by a 64-character hex digest with .php, .ini or .so - the shape
      watchTowr's CVE-2023-36846 reproduction gave uploads; a php.ini with
      auto_prepend_file turns an upload into code execution.
    basis: researcher
confidence: high
references:
  - title: Mandiant - China-nexus espionage targets Juniper routers (12 March 2025)
    url: https://cloud.google.com/blog/topics/threat-intelligence/china-nexus-espionage-targets-juniper-routers
    accessed: "2026-10-22"
  - title: Juniper - using the Juniper Malware Removal Tool
    url: https://juniper.net/documentation/us/en/software/junos/security-services/topics/topic-map/using-the-juniper-malware-removal-tool.html
    accessed: "2026-10-22"
  - title: Juniper - Junos OS Evolved overview
    url: https://www.juniper.net/documentation/us/en/software/junos/overview-evo/topics/concept/evo-overview.html
    accessed: "2026-10-22"
notes: >-
  CVE-2026-21902 (Junos OS Evolved on PTX, unauthenticated root RCE in the
  On-Box Anomaly detection framework, Feb 2026) is listed in VulnCheck KEV but
  not in CISA KEV as of the 21 October 2026 catalog. Its exploit details come
  from secondary sources only, so there is no pack for it yet. The 2023 J-Web
  chain (CVE-2023-36844 to 36847 and 36851) is in CISA KEV; no pack yet.
