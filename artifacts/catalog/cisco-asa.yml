# Edge platform catalog entry
# EDGE-0005 - Cisco ASA / FTD

id: EDGE-0005
name: Cisco ASA / Firepower Threat Defense
vendor: Cisco
products: [ASA 5500-X, Secure Firewall ASA, Firepower Threat Defense, ASAv]
os_base: lina (monolithic ASA process) on Linux; FTD adds a Linux expert mode
filesystem: disk0 holds images and packages processed at boot
customer_shell: restricted
memory_acquisition: vendor-assisted
profile: cisco-asa
collection:
  - method: Exec CLI show and dir commands
    impact: none
    description: Memory region map, processes, sessions, configuration, logging state, disk0 contents.
    confidence: high
  - method: Implant check on the lina text section (CISA)
    impact: none
    description: >-
      CISA's ED 25-03 command more /binary system:/text | grep 55534154 41554156
      41575756 488bb3a0, run before the core dump. CISA - "Any output from this
      command is an indicator of compromise." CISA also says to stop and contact
      it if the device crashes while running this step.
    confidence: medium
    references: [https://www.cisa.gov/news-events/directives/supplemental-direction-ed-25-03-core-dump-and-hunt-instructions]
  - method: Core dump scanned with RayDetect
    impact: break-glass
    description: >-
      CISA ED 25-03 Supplemental Direction procedure, which starts with a soft
      reboot and then crashinfo force page-fault; both reload the device. Run
      only after every live step. LINE DANCER and LINE VIPER both turn a dump
      request into a reboot. CISA also requires core dumps from Firepower and
      Secure Firewall devices, submitted to CISA; RayDetect "CANNOT detect
      RayInitator within core dumps for Firepower devices".
    confidence: high
    references:
      - https://www.cisa.gov/news-events/directives/supplemental-direction-ed-25-03-core-dump-and-hunt-instructions
      - https://github.com/cisagov/RayDetect
volatility:
  - LINE DANCER was memory-only; a reboot erases it
  - An unexplained reboot (uptime reset) or a crashinfo record can reveal a forced reload
anti_forensics:
  - technique: Hooked the core-dump routine so a dump request rebooted the device
    seen_in: LINE DANCER (ArcaneDoor, 2024)
  - technique: Disabled syslog
    seen_in: LINE DANCER (ArcaneDoor, 2024)
  - technique: Boot-level persistence below the OS on models without Secure Boot
    seen_in: RayInitiator (2025)
  - technique: Suppressed syslog IDs 302013, 302014, 609002 and 710005 in memory, invisible in the running config
    seen_in: ArcaneDoor 2025 (Cisco detection guide)
  - technique: Disabled checkheaps
    seen_in: ArcaneDoor 2025 (Cisco detection guide)
  - technique: Persistent implant in FXOS that survives upgrade, reboot and reload; reimaging removes it (Cisco's recommendation), and Cisco says a cold restart also removes it
    seen_in: FIRESTARTER (FXOS lina_cs implant, 2026)
  - technique: Modified the core-dump signal handler so that a dump request reboots the device immediately
    seen_in: LINE VIPER (NCSC MAR v1.1)
  - technique: Hooked the copy command so that copying system:/text reboots the device
    seen_in: LINE VIPER (NCSC MAR v1.1)
  - technique: Hooked the verify command so that hashing system:/text returns the hash of the legitimate firmware's text section
    seen_in: LINE VIPER (NCSC MAR v1.1)
  - technique: Forces a delayed reboot unless cancelled; NCSC observed delays between one and ten hours
    seen_in: LINE VIPER (NCSC MAR v1.1)
  - technique: Harvests user CLI commands
    seen_in: LINE VIPER (NCSC MAR v1.1)
response: cisco-asa
hardening: cisco-asa
artifacts:
  - locator: show memory region | include lina
    class: memory
    volatility: live
    forensic_value: high
    evidence_type: [execution, defense-evasion]
    confidence: high
    collected_by: mem_region_lina
    description: The vendor's LINE DANCER check - more than one executable region for lina. Gone on reload. Runs before anything else.
    seen_in: [LINE DANCER]
    provides: >-
      The memory regions mapped to the lina process.
    normal: >-
      One executable (r-xp) lina region. NCSC - the number of lina regions of all
      permissions "has been observed being either 2 or 5" depending on the ASA
      version and "in itself is not an indicator of compromise". A normal map
      does not clear the device: NCSC reports LINE VIPER (2025) does not leave
      the split-lina effect.
    suspicious: >-
      More than one r-xp lina region, especially one of exactly 0x1000 bytes -
      Talos's LINE DANCER check; NCSC calls a 0x1000 region "a strong indicator
      of compromise for Line Dancer".
    basis: vendor
  - locator: more /binary system:/text | grep 55534154 41554156 41575756 488bb3a0
    class: memory
    volatility: live
    forensic_value: high
    evidence_type: [execution, defense-evasion]
    confidence: medium
    collected_by: lina_text_implant_grep
    description: >-
      CISA's ED 25-03 check for the presence of the 2025 actor's implant in the
      running lina text section. Gone on reload. CISA gives the command but not
      its output. Break-glass and opt-in: CISA warns the device can crash during
      its initial commands and NCSC reports LINE VIPER reboots the device on
      access to system:/text, so it runs last, beside the core dump.
    seen_in: [LINE VIPER]
    provides: >-
      Lines of the running text section that contain CISA's byte sequence.
    normal: >-
      No output.
    suspicious: >-
      Any output - CISA: "Any output from this command is an indicator of
      compromise."
    basis: government
  - locator: "dir /recursive disk0:"
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: high
    collected_by: dir_disk0
    description: LINE RUNNER arrived as client_bundle_install.zip, processed at boot by a legacy capability. Every zip here needs an owner.
    seen_in: [LINE RUNNER]
    provides: >-
      Files on the boot disk.
    normal: >-
      Images and files with a known owner.
    suspicious: >-
      client_bundle_install.zip or any zip nobody put there - how LINE RUNNER
      arrived.
    basis: vendor
  - locator: Core dump (vendor / CISA procedure)
    class: memory
    volatility: live
    forensic_value: high
    evidence_type: [execution, persistence, defense-evasion]
    confidence: high
    collected_by: manual
    description: Scanned with RayDetect (confident only for ASA 5500-X on 9.12 and 9.14; not Firepower or ASAv) for the 2025 bootkit activity. Break-glass - CISA's procedure reloads the device, and LINE DANCER and LINE VIPER both turn a dump request into a reboot. CISA - if no dump file is written after a second attempt, "document and inform CISA; this may indicate an error or possible compromise."
    seen_in: [RayInitiator, LINE VIPER]
    provides: >-
      A full memory image for RayDetect and Cisco.
    normal: >-
      RayDetect finds nothing - meaningful only on ASA 5500-X running 9.12 or 9.14.
    suspicious: >-
      A RayDetect detection.
    basis: government
  - locator: show logging
    class: system-logs
    volatility: live
    forensic_value: medium
    evidence_type: [defense-evasion]
    confidence: high
    collected_by: show_logging
    description: Logging state and buffer. ArcaneDoor disabled syslog; a buffer that ends abruptly is a finding.
    seen_in: [LINE DANCER]
    provides: >-
      Logging state and the local buffer.
    normal: >-
      Logging enabled; a buffer that runs continuously up to now.
    suspicious: >-
      Logging disabled, or a buffer that stops abruptly - ArcaneDoor disabled
      syslog.
    basis: vendor
  - locator: show version (uptime)
    class: identity
    volatility: live
    forensic_value: medium
    evidence_type: [timeline, defense-evasion]
    confidence: high
    collected_by: show_version
    description: A low uptime (unexpected reboot) after the window is itself evidence; a reload also erased anything memory-only. ASA prints uptime here, not a reload reason.
    provides: >-
      Release and time since the last reload.
    normal: >-
      Uptime that matches the last planned maintenance.
    suspicious: >-
      A reload nobody planned after the window; it also erased anything memory-only.
    basis: toolkit
  - locator: show running-config (logging, aaa, capture sections)
    class: config
    volatility: stable
    forensic_value: high
    evidence_type: [defense-evasion, credential-access, configuration]
    confidence: high
    collected_by: show_running_config
    description: ArcaneDoor altered AAA and set up packet captures. Diff these sections first.
    seen_in: [LINE DANCER]
    provides: >-
      Logging, AAA and capture configuration.
    normal: >-
      Matches the backup and change records.
    suspicious: >-
      AAA changes or packet captures nobody owns - ArcaneDoor altered AAA and set up
      captures.
    basis: vendor
  - locator: show vpn-sessiondb anyconnect / show ssh sessions
    class: sessions
    volatility: live
    forensic_value: medium
    evidence_type: [initial-access, credential-access]
    confidence: high
    collected_by: show_vpn_anyconnect
    description: Remote-access and management sessions now active.
    provides: >-
      Remote-access and management sessions now active.
    normal: >-
      Expected users; management SSH from management addresses.
    suspicious: >-
      Management sessions from the internet, users nobody recognises.
    basis: toolkit
  - locator: Syslog receiver copies
    class: off-box
    volatility: off-box
    forensic_value: high
    evidence_type: [timeline, defense-evasion]
    confidence: high
    collected_by: ingest
    description: The device stopped sending during LINE DANCER activity; the silence is the indicator.
    provides: >-
      The record the device could not suppress.
    normal: >-
      A continuous stream.
    suspicious: >-
      The device going quiet during the window - LINE DANCER disabled syslog -
      or IDs 302013, 302014, 609002 and 710005 dropping out or falling in volume
      while other messages continue (2025 activity).
    basis: vendor
  - locator: show kernel process | include lina_cs
    class: process
    volatility: live
    forensic_value: high
    evidence_type: [persistence, execution]
    confidence: high
    collected_by: show_kernel_lina_cs
    description: Cisco's check for the 2026 FXOS persistent implant (FIRESTARTER, per Talos) on Firepower and Secure Firewall hardware. Survives reload; a cold restart removes it, so collect before power is pulled. For these models CISA also requires a core dump, submitted to CISA; RayDetect cannot detect RayInitiator in Firepower dumps.
    seen_in: [FXOS lina_cs implant]
    provides: >-
      Whether a process named lina_cs is running in the base operating system.
    normal: >-
      No output. Cisco documents the legitimate lina_cs occasionally getting
      stuck; verify disk0:/asdm.bin and run the command again.
    suspicious: >-
      Any output that survives that false-positive check - Cisco considers the
      device compromised. The name can change, so no output is not proof.
    basis: vendor
  - locator: show checkheaps (twice)
    class: memory
    volatility: live
    forensic_value: medium
    evidence_type: [defense-evasion]
    confidence: high
    collected_by: show_checkheaps
    description: The heap checker's run counter. Checkheaps runs every 60 seconds by default; the 2025 actor disabled it.
    provides: >-
      Seconds since the heap checker last ran and how many times it has run.
    normal: >-
      Total number of runs rising about once a minute.
    suspicious: >-
      A counter that does not rise across readings taken once a minute for five
      minutes - Cisco calls this evidence of a potential compromise.
    basis: vendor
confidence: high
