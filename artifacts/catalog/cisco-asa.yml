# Edge platform catalog entry
# EDGE-0005 - Cisco ASA / FTD

id: EDGE-0005
name: Cisco ASA / Firepower Threat Defense
vendor: Cisco
products: [ASA 5500-X, Secure Firewall ASA, Firepower Threat Defense, ASAv]
os_base: lina (monolithic ASA process) on Linux; FTD adds a Linux expert mode
filesystem: disk0 holds images and packages processed at boot
customer_shell: restricted
memory_acquisition: vendor-assisted
profile: cisco-asa
collection:
  - method: Exec CLI show and dir commands
    impact: none
    description: Memory region map, processes, sessions, configuration, logging state, disk0 contents.
    confidence: high
  - method: Core dump scanned with RayDetect
    impact: break-glass
    description: CISA ED 25-03 procedure. Run only after the memory-region check; LINE DANCER turned dump requests into reloads.
    confidence: high
    references: [https://github.com/cisagov/RayDetect]
volatility:
  - LINE DANCER was memory-only; a reboot erases it
  - An unexplained reboot (uptime reset) or a crashinfo record can reveal a forced reload
anti_forensics:
  - technique: Hooked the core-dump routine so a dump request rebooted the device
    seen_in: LINE DANCER (ArcaneDoor, 2024)
  - technique: Disabled syslog
    seen_in: LINE DANCER (ArcaneDoor, 2024)
  - technique: Boot-level persistence below the OS on models without Secure Boot
    seen_in: RayInitiator (2025)
response: cisco-asa
hardening: cisco-asa
artifacts:
  - locator: show memory region | include lina
    class: memory
    volatility: live
    forensic_value: high
    evidence_type: [execution, defense-evasion]
    confidence: high
    collected_by: mem_region_lina
    description: The vendor's LINE DANCER check - more than one executable region for lina. Gone on reload. Runs before anything else.
    seen_in: [LINE DANCER]
  - locator: "dir /recursive disk0:"
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: high
    collected_by: dir_disk0
    description: LINE RUNNER arrived as client_bundle_install.zip, processed at boot by a legacy capability. Every zip here needs an owner.
    seen_in: [LINE RUNNER]
  - locator: Core dump (vendor / CISA procedure)
    class: memory
    volatility: live
    forensic_value: high
    evidence_type: [execution, persistence, defense-evasion]
    confidence: high
    collected_by: manual
    description: Scanned with RayDetect (confident only for ASA 5500-X on 9.12 and 9.14; not Firepower or ASAv) for the 2025 bootkit activity. Break-glass - LINE DANCER turned a dump request into a reload.
    seen_in: [RayInitiator, LINE VIPER]
  - locator: show logging
    class: system-logs
    volatility: live
    forensic_value: medium
    evidence_type: [defense-evasion]
    confidence: high
    collected_by: show_logging
    description: Logging state and buffer. ArcaneDoor disabled syslog; a buffer that ends abruptly is a finding.
    seen_in: [LINE DANCER]
  - locator: show version (uptime)
    class: identity
    volatility: live
    forensic_value: medium
    evidence_type: [timeline, defense-evasion]
    confidence: high
    collected_by: show_version
    description: A low uptime (unexpected reboot) after the window is itself evidence; a reload also erased anything memory-only. ASA prints uptime here, not a reload reason.
  - locator: show running-config (logging, aaa, capture sections)
    class: config
    volatility: stable
    forensic_value: high
    evidence_type: [defense-evasion, credential-access, configuration]
    confidence: high
    collected_by: show_running_config
    description: ArcaneDoor altered AAA and set up packet captures. Diff these sections first.
    seen_in: [LINE DANCER]
  - locator: show vpn-sessiondb anyconnect / show ssh sessions
    class: sessions
    volatility: live
    forensic_value: medium
    evidence_type: [initial-access, credential-access]
    confidence: high
    collected_by: show_vpn_anyconnect
    description: Remote-access and management sessions now active.
  - locator: Syslog receiver copies
    class: off-box
    volatility: off-box
    forensic_value: high
    evidence_type: [timeline, defense-evasion]
    confidence: high
    collected_by: ingest
    description: The device stopped sending during LINE DANCER activity; the silence is the indicator.
confidence: high
