# Edge platform catalog entry
# EDGE-0004 - Citrix NetScaler ADC / Gateway

id: EDGE-0004
name: NetScaler ADC / Gateway
vendor: Citrix (Cloud Software Group)
products: [NetScaler ADC, NetScaler Gateway, VPX, MPX, SDX]
os_base: FreeBSD
filesystem: Root is a memory disk rebuilt at boot; /var and /flash persist on disk
customer_shell: "yes"
memory_acquisition: hypervisor-only
profile: netscaler
collection:
  - method: nsroot CLI and `shell` commands over SSH
    impact: none
    description: Full live response is possible, using the device's own binaries.
    confidence: high
  - method: SFTP retrieval of logs and web-root files
    impact: none
    description: ns.log rotations, HTTP logs, PHP files under the web roots.
    confidence: medium
  - method: Offline disk image (md0 / da0) or hypervisor snapshot
    impact: break-glass
    description: The check that does not trust on-box binaries. Prior art exists for Dissect-based triage.
    confidence: high
    references: [https://github.com/fox-it/citrix-netscaler-triage]
volatility:
  - Anything written to the memory-disk root is gone after reboot
  - ns.log rotates quickly on busy gateways; the vendor says "the system logs may only be available for a few days prior", so a short window of logs says little about memory-disclosure attempts
anti_forensics:
  - technique: Actively erased traces (NCSC-NL - "zijn er actief sporen gewist")
    seen_in: CVE-2025-6543 exploitation (NCSC-NL)
  - technique: Most backdoored NetScalers had been patched after the web shell was planted; patching did not remove it
    seen_in: CVE-2023-3519 mass exploitation (Fox-IT / NCC Group)
response: netscaler
hardening: netscaler
artifacts:
  - locator: /var/log/ns.log*
    class: auth-logs
    volatility: rotating
    retention: >-
      Days at most (vendor: "the system logs may only be available for a few days
      prior"), less on a busy gateway (Huntress); rotations are compressed in /var/log
    forensic_value: high
    evidence_type: [initial-access, credential-access, timeline]
    confidence: high
    collected_by: fetch_logs
    description: >-
      AAA events. CVE-2025-5777 memory-disclosure attempts surface, per NetScaler,
      as "Authentication is rejected for" lines with "AAA Message" and bytes in
      the range 128-255, and per Huntress as LOGIN_FAILED lines with an
      unprintable User value. Session reuse shows in SSLVPN TCPCONNSTAT lines
      where Client_ip and Source differ (vendor).
    seen_in: [CVE-2023-4966, CVE-2025-5777]
    provides: >-
      AAA events - logins, failures and session handling.
    normal: >-
      Login failures with readable usernames.
    suspicious: >-
      Login failures carrying non-printable bytes (leaked memory), or one session
      used from several addresses (hijack).
    basis: vendor
  - locator: /var/log/httpaccess.log* and httperror.log*
    class: web-logs
    volatility: rotating
    forensic_value: high
    evidence_type: [initial-access, timeline]
    confidence: medium
    collected_by: fetch_httpaccess
    description: Management and gateway web requests, including exploitation attempts against the SAML and gateway endpoints.
    provides: >-
      Web requests to the gateway and the management interface.
    normal: >-
      Gateway use from expected client addresses; management from management
      addresses.
    suspicious: >-
      Management requests from the internet, oversized requests to authentication
      endpoints, requests for PHP files that should not exist.
    basis: toolkit
  - locator: /var/netscaler/logon/**/*.php, /var/vpn/**, /netscaler/ns_gui/**
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, execution]
    confidence: high
    collected_by: fetch_php
    description: >-
      Web roots where the 2023 mass-exploitation web shells lived. Fox-IT's
      triage tool expects shipped PHP at mode 0444 (EXPECTED_PHP_FILE_PERMISSION)
      and reports other modes as suspicious; a writable or recently modified PHP
      file is a lead.
    seen_in: [CVE-2023-3519]
    provides: >-
      The PHP the gateway serves.
    normal: >-
      The release's files at mode 0444 (Fox-IT triage tool).
    suspicious: >-
      A writable or recently modified PHP file, or one containing eval, base64
      decoding or request-parameter execution.
    basis: researcher
  - locator: crontab -l, /etc/crontab
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: high
    collected_by: crontab_root
    description: Cron persistence.
    provides: >-
      Scheduled jobs.
    normal: >-
      The entries shipped with the release.
    suspicious: >-
      Entries that download content or run from /tmp.
    basis: toolkit
  - locator: find /var /tmp /flash -perm -4000
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: suid_files
    description: SUID binaries outside the shipped set.
    provides: >-
      Set-user-ID files.
    normal: >-
      The shipped set.
    suspicious: >-
      Set-user-ID files under /tmp, /var or /flash that the release does not ship.
    basis: toolkit
  - locator: sockstat -46 / netstat -an / ps auxww
    class: process
    volatility: live
    forensic_value: high
    evidence_type: [execution]
    confidence: high
    collected_by: shell_sockstat
    description: "A shell or interpreter owning a socket is a reverse shell. Trust is limited: a userland hook can hide processes from these binaries."
    provides: >-
      Listening and connected sockets with the owning process.
    normal: >-
      Known daemons listening on their usual ports.
    suspicious: >-
      sh, python or perl owning a socket - a reverse shell. A userland hook can hide
      it, so absence is weak.
    basis: toolkit
  - locator: show aaa session / show system session
    class: sessions
    volatility: live
    forensic_value: medium
    evidence_type: [credential-access, initial-access]
    confidence: medium
    collected_by: show_aaa_session
    description: Gateway and management sessions now active.
    provides: >-
      Gateway and management sessions now active.
    normal: >-
      Known users from expected addresses.
    suspicious: >-
      Sessions from unexpected addresses, or the same session from several
      addresses.
    basis: toolkit
  - locator: Disk images of md0 (memory-disk root) and the persistent disk (da0/ad0/ada0 by model)
    class: filesystem
    volatility: live
    forensic_value: high
    evidence_type: [persistence, defense-evasion, timeline]
    confidence: high
    collected_by: manual
    description: Offline triage that does not depend on the device's own binaries. Anything on md0 is lost at reboot.
    provides: >-
      The filesystems viewed without trusting the device's binaries.
    normal: >-
      Matches a clean image of the same release.
    suspicious: >-
      Any file the clean image does not have, and anything on md0 that should not
      exist - it is gone at reboot.
    basis: toolkit
  - locator: /etc/httpd.conf
    class: config
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, defense-evasion]
    confidence: medium
    collected_by: httpd_conf
    description: Apache configuration for the gateway and management UI. The 2026 intrusions enabled PHP and aliased CSS-looking paths to web shells.
    seen_in: [NetScaler 2026 log poisoning]
    provides: >-
      Which directories may run PHP, and every alias the web server maps.
    normal: >-
      php_flag engine off and Require all denied active where the release puts
      them; aliases you can account for.
    suspicious: >-
      php_flag engine on, either directive commented out, or an alias from a .css
      path to a file under LogonPoint/custom.
    basis: researcher
  - locator: /flash/nsconfig/rc.netscaler
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: rc_netscaler
    description: Start-up script on persistent flash; survives reboot and upgrade.
    provides: >-
      Commands the appliance runs at every boot.
    normal: >-
      Entries you or Citrix support added and can explain.
    suspicious: >-
      python, or anything launching from a hidden directory - NCSC-NL checks for
      python; Rapid7 saw the 2026 framework persist here.
    basis: government
  - locator: /var/netscaler/logon/LogonPoint/custom (listing)
    class: filesystem
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: logonpoint_custom
    description: The Gateway UI customisation directory, web-reachable by design and rarely watched.
    seen_in: [NetScaler 2026 log poisoning]
    provides: >-
      Every file in the customisation directory, including hidden ones.
    normal: >-
      Your own branding files.
    suspicious: >-
      .ctxs.receiver, .slap.receiver, receiver.deb or any hidden file - PHP web
      shells that the *.php search does not see.
    basis: researcher
  - locator: ls -la /bin/sh
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, defense-evasion]
    confidence: medium
    collected_by: bin_sh_mode
    description: The shell's permission bits.
    seen_in: [NetScaler 2026 log poisoning]
    provides: >-
      Whether /bin/sh is setuid.
    normal: >-
      -r-xr-xr-x, no setuid or setgid bit.
    suspicious: >-
      Mode 6555 (-r-sr-sr-x) - both Unit 42 and Rapid7 report the actor set it so
      the web process could become root.
    basis: researcher
confidence: high
references:
  - title: Fox-IT / NCC Group - approximately 2000 NetScalers backdoored
    url: https://www.nccgroup.com/research/approximately-2000-citrix-netscalers-backdoored-in-mass-exploitation-campaign/
    accessed: "2026-10-22"
  - title: NCSC-NL citrix-2025
    url: https://github.com/NCSC-NL/citrix-2025
    accessed: "2026-10-22"
  - title: NCSC-NL - casus Citrix kwetsbaarheid (CVE-2025-6543)
    url: https://www.ncsc.nl/alerts/casus-citrix-kwetsbaarheid
    accessed: "2026-10-23"
