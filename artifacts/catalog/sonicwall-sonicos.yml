notes: >-
  The firewall line, distinct from the SMA 100 (EDGE-0006) and SMA 1000 (EDGE-0011)
  remote access appliances: SonicWall says CVE-2024-53704 does not affect "SonicWall
  SSL VPN SMA100 and SMA1000 series products". No collection profile ships yet:
  SonicOS has no general shell, SonicWall's published CLI dump commits a change,
  and the read-only alternative is untested. Collect from the web console and the
  syslog server, then ingest. Event ids and message text are from the SonicOS/X
  7.0.1 Log Events reference; Arctic Wolf's 2025 lines show the same ids on later
  releases. The detections match the message text, which the syslog line (msg=)
  and the console's MESSAGE column both carry. Gen 6 has reached end of support
  (SonicWall, November 2026).
