# Edge platform catalog entry
# EDGE-0006 - SonicWall SMA 100

id: EDGE-0006
name: SonicWall SMA 100 series
vendor: SonicWall
products: [SMA 200, SMA 210, SMA 400, SMA 410, SMA 500v]
os_base: Linux
customer_shell: "no"
memory_acquisition: vendor-assisted
collection:
  - method: Tech support report and log export
    impact: none
    description: Logs and configuration through the management UI.
    confidence: medium
  - method: Offline disk image
    impact: break-glass
    description: GTIG advises acquiring disk images because the rootkit hides from on-box tools, and notes organisations may need to engage SonicWall for physical units.
    confidence: medium
anti_forensics:
  - technique: Userland rootkit hooking file and directory APIs through ld.so.preload
    seen_in: OVERSTEP (UNC6148, 2025)
  - technique: Removed its own log lines
    seen_in: OVERSTEP (UNC6148, 2025)
response: sonicwall-sma
hardening: sonicwall-sma
artifacts:
  - locator: /etc/ld.so.preload (offline image)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, defense-evasion]
    confidence: medium
    collected_by: ingest
    description: OVERSTEP loaded through the dynamic linker's preload file. Visible only on an offline image because the hook hides it from on-box tools.
    seen_in: [OVERSTEP]
    provides: >-
      Libraries the dynamic linker loads into every process.
    normal: >-
      Absent, or 2 bytes or fewer. GTIG - "This file should not exist with actual
      contents on a standard SMA appliance".
    suspicious: >-
      More than 2 bytes of contents (GTIG's threshold), above all a path to
      libsamba-errors.so.6 - visible only offline because the hook hides it.
      Check the copy inside the extracted INITRD as well.
    basis: researcher
  - locator: /usr/lib/libsamba-errors.so.6 (offline image)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: ingest
    description: The OVERSTEP library.
    seen_in: [OVERSTEP]
    provides: >-
      The library file itself.
    normal: >-
      Matches the clean firmware image.
    suspicious: >-
      Present or different from the clean image - the OVERSTEP library.
    basis: researcher
  - locator: /cf/xxx.elf and /cf/libsamba-errors.so.6 (offline image)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: ingest
    description: The persistent /cf directory, where the actor decoded OVERSTEP as xxx.elf and from which rc.fwboot copies libsamba-errors.so.6 into the INITRD at boot.
    seen_in: [OVERSTEP]
    provides: >-
      Files that survive a reboot outside the firmware image.
    normal: >-
      No binaries nobody can account for.
    suspicious: >-
      xxx.elf or libsamba-errors.so.6, or any file with GTIG's OVERSTEP hash; GTIG
      lists "Unexpected binaries within the persistent /cf directory or within
      INITRD files" as a hunting lead.
    basis: researcher
  - locator: /etc/rc.d/rc.fwboot and the INITRD (offline image)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: ingest
    description: Boot script and initrd modified to re-establish the rootkit on boot.
    seen_in: [OVERSTEP]
    provides: >-
      The boot script and initial ramdisk.
    normal: >-
      Match the clean firmware image.
    suspicious: >-
      Modified - OVERSTEP re-established itself on boot this way. GTIG publishes
      the SHA256 of the modified rc.fwboot it saw; the path itself exists on every
      appliance.
    basis: researcher
  - locator: Tech support report and exported logs
    class: system-logs
    volatility: rotating
    forensic_value: low
    evidence_type: [timeline]
    confidence: medium
    collected_by: ingest
    description: OVERSTEP removed its own log lines, so these establish the baseline of what is missing rather than what happened.
    seen_in: [OVERSTEP]
    provides: >-
      Exported logs and the support report.
    normal: >-
      Lines that line up with the syslog copy.
    suspicious: >-
      Lines missing compared with the syslog copy - OVERSTEP deleted its own.
    basis: researcher
confidence: medium
references:
  - title: Google Threat Intelligence Group - SonicWall SMA exploitation and the OVERSTEP backdoor (16 July 2025)
    url: https://cloud.google.com/blog/topics/threat-intelligence/sonicwall-secure-mobile-access-exploitation-overstep-backdoor
    accessed: "2026-10-23"
  - title: SonicWall - SNWLID-2025-0015, SMA100 10.2.2.2-92sv with additional file checking (22 September 2025)
    url: https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2025-0015
    accessed: "2026-10-23"
notes: No collection profile yet. Analysis runs against ingested image-triage output.
last_modified: "2026-10-22"
