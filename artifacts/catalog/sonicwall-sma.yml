# Edge platform catalog entry
# EDGE-0006 - SonicWall SMA 100

id: EDGE-0006
name: SonicWall SMA 100 series
vendor: SonicWall
products: [SMA 200, SMA 210, SMA 400, SMA 410, SMA 500v]
os_base: Linux
customer_shell: "no"
memory_acquisition: vendor-assisted
collection:
  - method: Tech support report and log export
    impact: none
    description: Logs and configuration through the management UI.
    confidence: medium
  - method: Offline disk image
    impact: break-glass
    description: GTIG advises acquiring disk images because the rootkit hides from on-box tools, and notes organisations may need to engage SonicWall for physical units.
    confidence: medium
anti_forensics:
  - technique: Userland rootkit hooking file and directory APIs through ld.so.preload
    seen_in: OVERSTEP (UNC6148, 2025)
  - technique: Removed its own log lines
    seen_in: OVERSTEP (UNC6148, 2025)
response: sonicwall-sma
hardening: sonicwall-sma
artifacts:
  - locator: /etc/ld.so.preload (offline image)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, defense-evasion]
    confidence: medium
    collected_by: ingest
    description: OVERSTEP loaded through the dynamic linker's preload file. Visible only on an offline image because the hook hides it from on-box tools.
    seen_in: [OVERSTEP]
    provides: >-
      Libraries the dynamic linker loads into every process.
    normal: >-
      Typically absent or empty on an appliance; compare with a clean image.
    suspicious: >-
      Any entry, and above all the OVERSTEP library - visible only offline because
      the hook hides it.
    basis: researcher
  - locator: /usr/lib/libsamba-errors.so.6 (offline image)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: ingest
    description: The OVERSTEP library.
    seen_in: [OVERSTEP]
    provides: >-
      The library file itself.
    normal: >-
      Matches the clean firmware image.
    suspicious: >-
      Present or different from the clean image - the OVERSTEP library.
    basis: researcher
  - locator: /etc/rc.d/rc.fwboot and the INITRD (offline image)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: ingest
    description: Boot script and initrd modified to re-establish the rootkit on boot.
    seen_in: [OVERSTEP]
    provides: >-
      The boot script and initial ramdisk.
    normal: >-
      Match the clean firmware image.
    suspicious: >-
      Modified - OVERSTEP re-established itself on boot this way.
    basis: researcher
  - locator: Tech support report and exported logs
    class: system-logs
    volatility: rotating
    forensic_value: low
    evidence_type: [timeline]
    confidence: medium
    collected_by: ingest
    description: OVERSTEP removed its own log lines, so these establish the baseline of what is missing rather than what happened.
    seen_in: [OVERSTEP]
    provides: >-
      Exported logs and the support report.
    normal: >-
      Lines that line up with the syslog copy.
    suspicious: >-
      Lines missing compared with the syslog copy - OVERSTEP deleted its own.
    basis: researcher
confidence: medium
references:
  - title: Google Threat Intelligence Group - SonicWall SMA exploitation and the OVERSTEP backdoor (16 July 2025)
    url: https://cloud.google.com/blog/topics/threat-intelligence/sonicwall-secure-mobile-access-exploitation-overstep-backdoor
    accessed: "2026-10-22"
notes: No collection profile yet. Analysis runs against ingested image-triage output.
