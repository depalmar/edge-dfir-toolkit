# Edge platform catalog entry
# EDGE-0002 - FortiOS

id: EDGE-0002
name: FortiOS (FortiGate / FortiProxy)
vendor: Fortinet
products: [FortiGate, FortiGate-VM, FortiProxy]
os_base: Proprietary Linux-based OS, restricted CLI
filesystem: Compressed root filesystem plus a persistent user filesystem; the user filesystem is where post-patch persistence was found
customer_shell: restricted
memory_acquisition: vendor-assisted
profile: fortios
collection:
  - method: CLI get / show / selected diagnose commands
    impact: none
    description: Status, process snapshot, admin and SSL-VPN sessions, configuration, crash log.
    confidence: high
  - method: diagnose sys filesystem hash (documented for 7.2.6 and 7.4.0)
    impact: none
    description: SHA-256 of system files. Meaningful only against a baseline of the same build.
    confidence: high
    references: [https://docs.fortinet.com/document/fortigate/7.2.0/new-features/860150/command-to-compute-file-hashes-7-2-6]
  - method: fnsysctl ls / cat
    impact: none
    description: >-
      Limited read access to the filesystem, used for directory listings.
      Fortinet: "The ' fnsysctl' command will only work when logged in as a
      super_admin (administrator accounts with super_admin permission profile)."
    confidence: medium
    references: [https://community.fortinet.com/fortigate-3/technical-tip-critical-vulnerability-protect-against-heap-based-buffer-overflow-in-sslvpnd-125663]
volatility:
  - The crash log is expected to survive a reboot and /tmp not to, but no vendor statement confirms either; collect both before any reboot
anti_forensics:
  - technique: Symlink persistence in the user filesystem that survived patching
    seen_in: Vendor PSIRT disclosure, April 2025
    detail: The vendor stated it avoided detection; patching did not remove it.
  - technique: Implants that survive reboot and upgrade
    seen_in: COATHANGER
response: fortios
hardening: fortios
artifacts:
  - locator: diagnose sys filesystem hash
    class: integrity
    volatility: live
    forensic_value: high
    evidence_type: [persistence, defense-evasion]
    confidence: high
    collected_by: fs_hash
    description: SHA-256 of system files (documented for FortiOS 7.2.6 and 7.4.0; earlier builds not confirmed). Only meaningful against a baseline from the same build; the toolkit refuses to score it without one.
    provides: >-
      A SHA-256 for every system file.
    normal: >-
      Identical to a baseline from a known-good device on the same build.
    suspicious: >-
      Files that differ from, or are missing in, that baseline. Without a baseline
      the output proves nothing.
    basis: vendor
  - locator: diagnose debug crashlog read
    class: system-logs
    volatility: stable
    forensic_value: high
    evidence_type: [initial-access, timeline]
    confidence: high
    collected_by: crashlog
    description: >-
      Crash log. sslvpnd signal 11 crashes were the vendor's published indicator
      for CVE-2022-42475 attempts. The application and the signal are printed on
      separate rows. Fortinet's primary instruction is the event log
      (Logdesc="Application crashed" ... application: sslvpnd ... Signal 11
      received); the crash log is its alternative. No vendor statement says how
      long either is kept.
    seen_in: [CVE-2022-42475]
    provides: >-
      Daemon crashes with process token and signal.
    normal: >-
      Rare crashes that match a known bug in the release notes.
    suspicious: >-
      Fortinet: "Search for multiple examples" of an "application sslvpnd" row
      followed by "*** signal 11 (Segmentation fault) received ***".
    basis: vendor
  - locator: SSL-VPN language-file directory (operator-supplied path)
    class: persistence
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, defense-evasion]
    confidence: low
    unverified: true
    collected_by: listing_sslvpn_lang
    description: >-
      Where the 2025 symlink persistence lived, giving read-only root filesystem
      access that survived patching. Fortinet does not publish the path; the
      researcher Fortinet credits in FG-IR-25-934 gives /migadmin/lang. This
      project has not confirmed it on a device; supply it with --var.
    seen_in: [symlink persistence 2025]
    provides: >-
      The files SSL-VPN serves as language resources.
    normal: >-
      Compressed language files and one link, custom -> /data2/custom_lang
      (researcher: "there is always custom pointing to /data2/custom_lang").
    suspicious: >-
      custom, or any other entry, linking to / or another root path - the
      attackers repointed /migadmin/lang/custom at the root of the FortiGate.
    basis: researcher
  - locator: fnsysctl ls -l /data/lib, ls -la /var, ls -l /data/etc, ls -l /
    class: filesystem
    volatility: stable
    forensic_value: high
    evidence_type: [persistence]
    confidence: medium
    collected_by: listing_data_lib
    description: The four listings Fortinet's CVE-2022-42475 tech tip names for its file indicators (steps listing_data_lib, listing_var, listing_data_etc, listing_root).
    seen_in: [CVE-2022-42475]
    provides: >-
      Directory listings of /data/lib, /var, /data/etc and /.
    normal: >-
      None of the published indicator files present.
    suspicious: >-
      /data/lib/libips.bak, libgif.so, libiptcp.so, libipudp.so, libjepg.so,
      /var/.sslvpnconfigbk, /data/etc/wxd.conf or /flash (FG-IR-22-398).
    basis: vendor
  - locator: fnsysctl ls -la /bin and /data/bin
    class: filesystem
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, defense-evasion]
    confidence: medium
    collected_by: listing_bin
    description: System binaries. Mandiant published this listing for CVE-2022-41328; MIVD/AIVD use it for COATHANGER's smartctl.
    seen_in: [CVE-2022-41328, COATHANGER]
    provides: >-
      Names, types, sizes and timestamps of system binaries.
    normal: >-
      Mandiant: "/bin/lspci should always be a standalone binary"; most other
      entries are links to /bin/init.
    suspicious: >-
      lspci as a link (to /bin/sysctl in Mandiant's case); a file named fgfm
      (CASTLETAP); smartctl that "is not a symlink" or was modified later than
      most other files (MIVD/AIVD).
    basis: researcher
  - locator: diagnose sys tcpsock / diagnose sys process dump 1
    class: process
    volatility: live
    forensic_value: high
    evidence_type: [persistence, execution]
    confidence: medium
    collected_by: tcpsock
    description: Active TCP sockets with owning process, and the memory map of PID 1 (step proc_dump_init). Both are MIVD/AIVD's COATHANGER CLI checks.
    seen_in: [COATHANGER]
    provides: >-
      Sockets with process=<PID>/<name>; process status and memory map.
    normal: >-
      Not published; httpsd is also the name of the genuine web daemon.
    suspicious: >-
      An outgoing connection to an external address from a process called
      httpsd; deleted entries linked to /lib/preload.so in PID 1's map
      (MIVD/AIVD). The advisory warns the names vary between samples.
    basis: government
  - locator: diagnose sys top
    class: process
    volatility: live
    forensic_value: medium
    evidence_type: [execution]
    confidence: medium
    collected_by: diag_sys_top
    description: Process snapshot. Implanted daemons and renamed binaries show here first.
    provides: >-
      Running processes with CPU and memory.
    normal: >-
      The release's daemons.
    suspicious: >-
      Unknown process names, renamed binaries, or a daemon you do not use consuming
      CPU.
    basis: toolkit
  - locator: get system admin list / get vpn ssl monitor
    class: sessions
    volatility: live
    forensic_value: medium
    evidence_type: [initial-access, credential-access]
    confidence: high
    collected_by: get_admin_list
    description: Administrators and SSL-VPN users logged in now, with source address.
    provides: >-
      Administrators and SSL-VPN users logged in now, with source addresses.
    normal: >-
      Known administrators from management addresses; VPN users from places they
      work.
    suspicious: >-
      Administrator sessions from internet addresses, accounts nobody recognises,
      sessions for disabled users.
    basis: toolkit
  - locator: show (full configuration)
    class: config
    volatility: stable
    forensic_value: high
    evidence_type: [persistence, configuration]
    confidence: high
    collected_by: show_config
    description: Diff against backup for new admins, local users, SSL-VPN portals, automation stitches and scripts.
    provides: >-
      The full configuration.
    normal: >-
      Matches the last backup and the change records.
    suspicious: >-
      New administrators, local users, SSL-VPN portals, automation stitches or
      scripts that nobody owns.
    basis: toolkit
  - locator: FortiAnalyzer / FortiCloud / syslog event, VPN and admin logs
    class: off-box
    volatility: off-box
    forensic_value: high
    evidence_type: [timeline, initial-access, credential-access]
    confidence: high
    collected_by: ingest
    description: Off-box copies for the full retention window; on-box logs are short and attacker-reachable.
    provides: >-
      Event, VPN and administrator logs for the full retention window.
    normal: >-
      Continuous logs; administrator logins from management addresses.
    suspicious: >-
      Administrator logins from unknown addresses, new accounts, or gaps in the
      stream.
    basis: toolkit
confidence: high
