# Schema: ../schema/hunt.schema.json

id: EDGE-HUNT-0004
title: On-box packet capture of AAA traffic followed by a file transfer
platforms:
- EDGE-0009
- EDGE-0005
- ALL
actors:
- EDGE-TA-0007
- EDGE-TA-0003
seen_in:
- AA25-239A
- ArcaneDoor (Talos)
hypothesis: >-
  The actor captured TACACS+ or RADIUS traffic to harvest keys and exported the capture.
data:
- aaa-accounting
- syslog
- netflow
method:
- >-
  Look for monitor capture ... start, embedded packet capture, or monitor-session definitions;
  on ASA, capture commands.
- >-
  Flag captures filtered on TCP/49 or RADIUS, and capture files named mycap.pcap, tac.pcap
  or 1.pcap.
- >-
  Join to a device-originated FTP or TFTP flow within hours (see the device-originated transfer
  hunt).
normal: A TAC-led capture with a ticket.
suspicious: A capture of AAA ports, or a capture followed by an export.
attack:
- T1040
- T1048
confidence: medium
