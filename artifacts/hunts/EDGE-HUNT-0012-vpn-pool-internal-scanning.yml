  On domain controllers, flag LDAP filters servicePrincipalName=*cert*, *pki*, *public* and
  objectclass=* from VPN-pool hosts.
normal: A few destinations per user.
suspicious: Fan-out across many hosts, or certificate-service enumeration.
attack:
- T1046
- T1087.002
inferred: Capturing LDAP filters needs domain controller diagnostic logging or EDR.
confidence: medium
