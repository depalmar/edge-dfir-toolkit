- ArcaneDoor 2025 (CISA)
- Check Point CVE-2026-85102
hypothesis: An actor holding a VPN session is mapping the internal network.
data:
- netflow
- edr
data_detail: >-
  Internal firewall logs or NetFlow keyed on VPN-pool addresses; LDAP query logs on domain
  controllers.
method:
- >-
  From each VPN-pool source, count distinct internal destinations and ports per hour; flag
  spikes, especially printers on TCP/443.
