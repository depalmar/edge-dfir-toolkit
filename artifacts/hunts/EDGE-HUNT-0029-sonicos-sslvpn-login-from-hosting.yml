  url: https://arcticwolf.com/resources/blog/arctic-wolf-labs-observes-increased-fog-and-akira-ransomware-activity-linked-to-sonicwall-ssl-vpn/
  accessed: '2026-11-08'
  quote: In almost all intrusions, connections to the VPNs originated from hosting-related ASNs.
  read: direct
