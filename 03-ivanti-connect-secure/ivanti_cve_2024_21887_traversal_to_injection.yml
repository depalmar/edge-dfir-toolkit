title: Ivanti Connect Secure Traversal Into the License Keys-Status Endpoint (CVE-2023-46805 Chained With
  CVE-2024-21887)
id: a7592194-2bff-46c3-a8f1-edb7b314628f
status: experimental
description: 'The documented exploitation chain: the TOTP backup-code path traversal (CVE-2023-46805)
  reaching the

  license/keys-status endpoint that carries the command injection (CVE-2024-21887). Stronger than the

  traversal alone. The appliance''s own logs do not record these requests (Volexity, 10 January 2024);

  it needs an upstream reverse proxy, WAF or load balancer that logs the full request path.

  '
references:
- https://www.slcyber.io/research/high-signal-detection-and-exploitation-of-ivantis-pulse-connect-secure-auth-bypass-rce
- https://www.volexity.com/blog/2024/01/10/active-exploitation-of-two-zero-day-vulnerabilities-in-ivanti-connect-secure-vpn/
author: Raymond DePalma (edge-dfir-toolkit)
date: '2026-10-23'
tags:
- attack.initial_access
- attack.t1190
- attack.execution
- attack.t1059
- cve.2023-46805
- cve.2024-21887
logsource:
  category: webserver
detection:
  selection_endpoint:
    cs-uri-stem|contains: /api/v1/totp/user-backup-code/
  selection_traversal:
    cs-uri-stem|contains:
    - /../
    - '%2e%2e'
    - '%2E%2E'
    - '.%2e'
    - '%2e.'
  selection_sink:
    cs-uri-stem|contains: license/keys-status
  condition: all of selection_*
falsepositives:
- Vulnerability scanners and public proof-of-concept use (attempts, not success).
level: high
