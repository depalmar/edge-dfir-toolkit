title: Ivanti Connect Secure Path Traversal Through the TOTP Endpoint (CVE-2023-46805 / CVE-2024-21887)
id: 84365f16-6dd9-4fc7-83de-ae395e4ac7c0
status: experimental
description: |
  The 2024 Ivanti Connect Secure chain bypassed authentication by traversing
  out of /api/v1/totp/user-backup-code/ into other REST endpoints, two of which
  passed input to a shell. Logs that record the raw URI show the traversal;
  appliances that normalise the path before logging will not.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-060b
  - https://www.volexity.com/blog/2024/01/18/ivanti-connect-secure-vpn-exploitation-new-observations/
author: Raymond DePalma (edge-dfir-toolkit)
date: 2026-10-22
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2023-46805
  - cve.2024-21887
logsource:
  category: webserver
detection:
  selection_endpoint:
    cs-uri-stem|contains: '/api/v1/totp/user-backup-code/'
  selection_traversal:
    cs-uri-stem|contains:
      - '/../'
      - '%2e%2e'
      - '%2E%2E'
  condition: selection_endpoint and selection_traversal
falsepositives:
  - None expected.
level: high
